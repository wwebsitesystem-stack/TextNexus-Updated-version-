<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Logo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0b0f19; /* Deep modern dark background */
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 30px 50px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Logo Icon Styling */
        .logo-icon {
            position: relative;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f2fe, #4facfe) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            animation: pulse 3s ease-in-out infinite;
        }

        .core-shape {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            transform: rotate(45deg);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.6);
            transition: transform 0.5s ease;
        }

        .logo-container:hover .core-shape {
            transform: rotate(225deg) scale(1.1);
        }

        /* Typography Styling */
        .logo-text {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: lowercase;
        }

        .logo-text span {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.05);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Graphic Icon -->
        <div class="logo-icon">
            <div class="ring"></div>
            <div class="core-shape"></div>
        </div>
        <!-- Brand Name -->
        <div class="logo-text">ne<span>x</span>us</div>
    </div>

</body>
</html>
