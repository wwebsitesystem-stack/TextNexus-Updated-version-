<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus // Transcendence OS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@200;300;400;500;600&display=swap');

        :root {
            --obsidian: #030407;
            --ether-gold: #f3e5ab;
            --pure-gold: #d4af37;
            --quantum-cyan: #00f0ff;
            --glass-bg: rgba(255, 255, 255, 0.015);
            --glass-border: rgba(212, 175, 55, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--obsidian);
            overflow: hidden;
            font-family: 'Plus Jakarta+Sans', sans-serif;
        }

        /* Deep Dimensional Background Effects */
        .universe-bg {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.04) 0%, transparent 60%),
                radial-gradient(circle at 20% 20%, rgba(0, 240, 255, 0.02) 0%, transparent 40%),
                var(--obsidian);
            z-index: -1;
        }

        .light-beam {
            position: absolute;
            top: -50%;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 200vh;
            background: linear-gradient(to bottom, transparent, rgba(243, 229, 171, 0.2), transparent);
            filter: blur(1px);
            z-index: -1;
            animation: divinePulse 6s ease-in-out infinite alternate;
        }

        /* Master Glass Container */
        .nexus-monolith {
            position: relative;
            display: flex;
            align-items: center;
            gap: 35px;
            padding: 40px 65px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 
                0 30px 100px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 0 40px rgba(212, 175, 55, 0.03);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nexus-monolith:hover {
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 
                0 40px 120px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                0 0 60px rgba(212, 175, 55, 0.08);
            transform: translateY(-3px);
        }

        /* Divine Quantum Core Icon */
        .core-emblem {
            position: relative;
            width: 75px;
            height: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .halo-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px dashed rgba(212, 175, 55, 0.35);
            border-radius: 50%;
            animation: rotateClockwise 25s linear infinite;
        }

        .halo-ring-inner {
            position: absolute;
            width: 55px;
            height: 55px;
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 50%;
            animation: rotateCounter 15s linear infinite;
        }

        .singularity-point {
            position: absolute;
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #ffffff 0%, var(--ether-gold) 50%, var(--pure-gold) 100%);
            border-radius: 50%;
            box-shadow: 0 0 25px var(--ether-gold), 0 0 50px rgba(0, 240, 255, 0.2);
            animation: divineGlow 4s ease-in-out infinite alternate;
        }

        /* Typography & Subtext */
        .brand-data {
            display: flex;
            flex-direction: column;
        }

        .brand-meta {
            font-size: 9px;
            font-weight: 300;
            letter-spacing: 6px;
            color: rgba(243, 229, 171, 0.6);
            text-transform: uppercase;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-meta::after {
            content: '';
            width: 20px;
            height: 1px;
            background: rgba(243, 229, 171, 0.3);
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 12px;
            color: #ffffff;
            text-transform: uppercase;
            margin-left: 6px; /* Balance tracking */
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .brand-title span {
            background: linear-gradient(135deg, #ffffff 0%, var(--ether-gold) 60%, var(--pure-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
        }

        .brand-frequency {
            font-size: 8px;
            font-weight: 200;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 6px;
            text-transform: uppercase;
        }

        .brand-frequency span {
            color: var(--quantum-cyan);
        }

        /* Animations */
        @keyframes rotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateCounter {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes divineGlow {
            0% { transform: scale(0.85); box-shadow: 0 0 15px var(--ether-gold), 0 0 30px rgba(0, 240, 255, 0.1); }
            100% { transform: scale(1.15); box-shadow: 0 0 35px var(--ether-gold), 0 0 60px rgba(0, 240, 255, 0.3); }
        }

        @keyframes divinePulse {
            0% { opacity: 0.3; transform: translateX(-50%) scaleX(1); }
            100% { opacity: 0.7; transform: translateX(-50%) scaleX(1.5); }
        }
    </style>
</head>
<body>

    <div class="universe-bg"></div>
    <div class="light-beam"></div>

    <div class="nexus-monolith">
        <!-- Divine Quantum Core -->
        <div class="core-emblem">
            <div class="halo-ring"></div>
            <div class="halo-ring-inner"></div>
            <div class="singularity-point"></div>
        </div>

        <!-- Typography & High-End Metadata -->
        <div class="brand-data">
            <div class="brand-meta">Divine Architecture</div>
            <div class="brand-title">NE<span>X</span>US</div>
            <div class="brand-frequency">Omni-Sync // <span style="color: var(--ether-gold);">Genesis Engine</span></div>
        </div>
    </div>

</body>
</html>
