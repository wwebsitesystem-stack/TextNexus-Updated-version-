<!-- public/textnexus.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus — Workspace Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0f0c1b;
            --bg-sidebar: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --card-msg-user: #2e2753;
            --card-msg-other: rgba(255, 255, 255, 0.05);
        }

        [data-theme="light"] {
            --bg-main: #f5f7fa;
            --bg-sidebar: rgba(0, 0, 0, 0.03);
            --glass-border: rgba(0, 0, 0, 0.08);
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --accent: #4f46e5;
            --card-msg-user: #4f46e5;
            --card-msg-other: rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        /* App Layout Architecture */
        .sidebar {
            width: 320px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .user-profile-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            border-color: #ef4444;
            color: #ef4444;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .main-chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.1);
        }

        .chat-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .message-history {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message-input-container {
            padding: 1.5rem;
            border-top: 1px solid var(--glass-border);
            background: var(--bg-main);
        }

        .input-wrapper {
            display: flex;
            gap: 1rem;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            padding: 0.5rem;
            border-radius: 14px;
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            padding: 0.5rem 1rem;
            font-size: 0.95rem;
        }

        .send-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .send-btn:hover {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>

    <!-- 1. SIDEBAR NAVIGATION CONTROLS -->
    <div class="sidebar">
        <div class="user-profile-header">
            <div class="user-info">
                <div class="avatar" id="myAvatar">U</div>
                <div>
                    <h4 id="myDisplayName">Loading...</h4>
                    <span style="font-size: 0.75rem; color: var(--text-muted);" id="myUsername">@...</span>
                </div>
            </div>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
        
        <div class="chat-list" id="chatListContainer">
            <!-- Conversations injection point -->
        </div>
    </div>

    <!-- 2. MAIN REAL-TIME INTERACTION PANEL -->
    <div class="main-chat-area">
        <div class="chat-header">
            <div class="avatar">#</div>
            <div>
                <h4>Global Nexus Server</h4>
                <p style="font-size: 0.8rem; color: #10b981;">● Online</p>
            </div>
        </div>

        <div class="message-history" id="messageBox">
            <!-- Active conversation timeline -->
        </div>

        <div class="message-input-container">
            <form id="chatForm">
                <div class="input-wrapper">
                    <input type="text" id="msgInput" placeholder="Message Global Nexus Server..." autocomplete="off">
                    <button type="submit" class="send-btn">Send</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 3. REAL-TIME PLATFORM COMMUNICATIONS INFRASTRUCTURE -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket;

        // Verify session data state instantly upon delivery
        async function checkIdentityHandshake() {
            try {
                const response = await fetch('/api/users/me');
                if (!response.ok) {
                    // Fail-secure protection bounce back to login if user isn't authenticated
                    window.location.href = '/index.html';
                    return;
                }
                const user = await response.json();
                
                // Mount profile values onto interface layout
                document.getElementById('myDisplayName').textContent = user.display_name || user.username;
                document.getElementById('myUsername').textContent = `@${user.username}`;
                document.getElementById('myAvatar').textContent = user.username.charAt(0).toUpperCase();

                // Initialize secure Socket.IO synchronization engine
                initializeSocketConnection();
            } catch (err) {
                window.location.href = '/index.html';
            }
        }

        function initializeSocketConnection() {
            socket = io();

            socket.on('connect', () => {
                console.log('📡 Connected securely to the real-time Nexus engine');
            });

            // Listen for structural inbound real-time transmissions
            socket.on('message:receive', (msg) => {
                appendIncomingMessage(msg);
            });
        }

        // Clean session wipe handler
        async function handleLogout() {
            const res = await fetch('/api/auth/logout', { method: 'POST' });
            if (res.ok) {
                window.location.href = '/index.html';
            }
        }

        document.getElementById('chatForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('msgInput');
            if (!input.value.trim()) return;

            const targetPayload = {
                content: input.value,
                timestamp: new Date()
            };

            // Dispatch out over live sockets
            socket.emit('message:send', targetPayload);
            input.value = '';
        });

        function appendIncomingMessage(msg) {
            const container = document.getElementById('messageBox');
            const element = document.createElement('div');
            element.style.padding = '0.75rem 1rem';
            element.style.borderRadius = '12px';
            element.style.maxWidth = '70%';
            element.style.background = 'var(--card-msg-other)';
            element.textContent = msg.content;
            container.appendChild(element);
            container.scrollTop = container.scrollHeight;
        }

        // Run security handshake immediately on load
        window.onload = checkIdentityHandshake;
    </script>
</body>
</html>
