<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexus Master Matrix - TextNexus</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #050508;
            color: #fff;
            margin: 0;
            display: flex;
            height: 100vh;
        }
        /* Sidebar styling for contacts and groups */
        .sidebar {
            width: 300px;
            background: #0b0b12;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }
        .sidebar h3 { color: #00ffcc; margin-top: 0; }
        .list-container { flex: 1; overflow-y: auto; margin-bottom: 15px; }
        .item-link {
            padding: 10px;
            background: #141420;
            margin-bottom: 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .item-link:hover { border-left: 3px solid #00ffcc; background: #1c1c2d; }
        
        /* Main Chat Window */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #020204; }
        .chat-header { background: #0b0b12; padding: 15px; border-bottom: 1px solid #222; color: #00ffcc; font-weight: bold; }
        .messages-view { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        /* Messages */
        .bubble { padding: 10px 14px; border-radius: 8px; max-width: 70%; font-size: 0.9rem; }
        .bubble.me { background: #00ffcc; color: #000; align-self: flex-end; }
        .bubble.them { background: #1a1a26; color: #fff; align-self: flex-start; }
        .sender-name { font-size: 0.75rem; color: #888; margin-bottom: 2px; }

        /* Input Controls */
        .input-bar { padding: 15px; background: #0b0b12; display: flex; gap: 10px; }
        input, button { padding: 10px; background: #141420; border: 1px solid #333; color: white; border-radius: 4px; }
        input:focus { border-color: #00ffcc; outline: none; }
        button { background: #00ffcc; color: black; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #00cca3; }
    </style>
</head>
<body>

    <!-- SIDEBAR: CONTACTS & GROUPS -->
    <div class="sidebar">
        <h3>TEXTNEXUS</h3>
        <div id="user-info" style="font-size: 0.85rem; color: #888; margin-bottom: 15px;">Checking session...</div>
        
        <h4>Create / Add</h4>
        <input type="text" id="contact-name" placeholder="Contact Name" style="margin-bottom: 5px; width: 90%;">
        <input type="email" id="contact-email" placeholder="Contact Email" style="margin-bottom: 5px; width: 90%;">
        <button id="add-contact-btn" style="width: 100%; margin-bottom: 15px;">+ Add Contact</button>
        
        <input type="text" id="group-name" placeholder="New Group Name" style="margin-bottom: 5px; width: 90%;">
        <button id="create-group-btn" style="width: 100%; margin-bottom: 20px;">👥 Create Group Chat</button>

        <h4>Conversations</h4>
        <div id="conversations-list" class="list-container"></div>
    </div>

    <!-- MAIN CHAT AREA -->
    <div class="chat-area">
        <div class="chat-header" id="current-chat-title">Select a contact or group to start texting</div>
        <div class="messages-view" id="messages-container"></div>
        <div class="input-bar">
            <input type="text" id="text-input" placeholder="Type a message..." style="flex: 1;" disabled>
            <button id="send-btn" disabled>Send 🚀</button>
        </div>
    </div>

    <!-- FIREBASE MODULE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, push, onChildAdded, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com",
            projectId: "nexus-web-development-official"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        let currentUser = null;
        let activeChatId = null;

        // 1. REQUIRE SIGN IN & AUTO-INITIALIZE
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('user-info').innerText = `Signed in as: ${user.email}`;
                
                // Run the automatic data structuring
                autoInitializeUserSystem(user);
            } else {
                document.getElementById('user-info').innerText = "Not signed in!";
                alert("Please log into the main Nexus dashboard portal first!");
            }
        });

        // 2. AUTOMATIC SYSTEM STRUCTURER
        function autoInitializeUserSystem(user) {
            const userProfileRef = ref(database, `users/${user.uid}`);

            get(userProfileRef).then((snapshot) => {
                if (!snapshot.exists()) {
                    console.log("New user detected! Auto-building database nodes...");
                    
                    // Generate all missing user nodes automatically
                    set(userProfileRef, {
                        profile: {
                            email: user.email,
                            username: user.displayName || user.email.split('@')[0]
                        },
                        contacts: {
                            "global_nexus_matrix": {
                                name: "Nexus Network Broadcaster",
                                type: "group"
                              }
                        }
                    }).then(() => {
                        console.log("User nodes structured successfully.");
                        loadConversations(); // Load sidebar after creation
                    });

                    // Ensure global broadcast container path exists
                    const broadcastRef = ref(database, 'system/broadcast');
                    get(broadcastRef).then((bSnapshot) => {
                        if (!bSnapshot.exists()) {
                            set(broadcastRef, "System operational.");
                        }
                    });
                } else {
                    console.log("User database structure verified. System ready.");
                    loadConversations(); // Load sidebar immediately
                }
            });
        }

        // 3. ADD A CONTACT
        document.getElementById('add-contact-btn').addEventListener('click', () => {
            const name = document.getElementById('contact-name').value.trim();
            const email = document.getElementById('contact-email').value.trim();
            if (!name || !email) return alert("Fill in both name and email!");

            const cleanEmailHex = btoa(email).replace(/=/g, ""); 
            const chatId = `direct_${currentUser.uid}_${cleanEmailHex}`;

            set(ref(database, `users/${currentUser.uid}/contacts/${chatId}`), {
                name: name,
                email: email,
                type: "direct"
            }).then(() => {
                alert("Contact linked successfully!");
                loadConversations();
            });
        });

        // 4. CREATE A GROUP CHAT
        document.getElementById('create-group-btn').addEventListener('click', () => {
            const groupName = document.getElementById('group-name').value.trim();
            if (!groupName) return alert("Enter a group name!");

            const newChatRef = push(ref(database, 'chats'));
            const chatId = newChatRef.key;

            set(ref(database, `chats/${chatId}/metadata`), {
                name: groupName,
                type: "group",
                creator: currentUser.uid
            });

            set(ref(database, `users/${currentUser.uid}/contacts/${chatId}`), {
                name: groupName,
                type: "group"
            }).then(() => {
                alert("Group Matrix opened!");
                loadConversations();
            });
        });

        // 5. LOAD CONVERSATIONS ON SIDEBAR
        function loadConversations() {
            const listDiv = document.getElementById('conversations-list');
            listDiv.innerHTML = "";

            get(ref(database, `users/${currentUser.uid}/contacts`)).then((snapshot) => {
                if (!snapshot.exists()) return;
                snapshot.forEach((childSnapshot) => {
                    const chatId = childSnapshot.key;
                    const info = childSnapshot.val();

                    const div = document.createElement('div');
                    div.classList.add('item-link');
                    div.innerText = info.type === "group" ? `👥 ${info.name}` : `👤 ${info.name}`;
                    div.addEventListener('click', () => openChat(chatId, info.name));
                    listDiv.appendChild(div);
                });
            });
        }

        // 6. OPEN CHAT AND STREAM LIVE MESSAGES
        function openChat(chatId, title) {
            activeChatId = chatId;
            document.getElementById('current-chat-title').innerText = title;
            document.getElementById('text-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            
            const container = document.getElementById('messages-container');
            container.innerHTML = ""; 

            const messagesRef = ref(database, `chats/${chatId}/messages`);
            onChildAdded(messagesRef, (snapshot) => {
                const msg = snapshot.val();
                if (msg) {
                    const bubble = document.createElement('div');
                    bubble.classList.add('bubble', msg.senderId === currentUser.uid ? 'me' : 'them');
                    
                    bubble.innerHTML = `<div class="sender-name">${msg.senderName}</div>${msg.text}`;
                    container.appendChild(bubble);
                    container.scrollTop = container.scrollHeight;
                }
            });
        }

        // 7. SEND MESSAGE BUTTON
        function handleSend() {
            const textInput = document.getElementById('text-input');
            const text = textInput.value.trim();
            if (!text || !activeChatId) return;

            const msgData = {
                senderId: currentUser.uid,
                senderName: currentUser.displayName || currentUser.email.split('@')[0],
                text: text,
                timestamp: Date.now()
            };

            push(ref(database, `chats/${activeChatId}/messages`), msgData)
                .then(() => {
                    textInput.value = "";
                    sendEmailNotification(activeChatId, msgData.senderName, text);
                });
        }

        document.getElementById('send-btn').addEventListener('click', handleSend);
        document.getElementById('text-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // 8. EMAIL TRIGGER SYSTEM LINK
        function sendEmailNotification(chatId, sender, text) {
            push(ref(database, 'system/email_queue'), {
                chatId: chatId,
                senderName: sender,
                messagePreview: text,
                timestamp: Date.now()
            });
        }
    </script>
</body>
</html>
