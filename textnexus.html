<!-- public/textnexus.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus — Secure Messaging Gateway</title>
    <!-- Google Fonts for Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c1b 0%, #16122c 50%, #05030a 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --error: #ef4444;
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            --glass-bg: rgba(0, 0, 0, 0.02);
            --glass-border: rgba(0, 0, 0, 0.08);
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .gateway-container {
            width: 100%;
            max-width: 440px;
            padding: 2rem;
            border-radius: 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand h1 {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .brand p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .input-group input {
            width: 100%;
            padding: 0.85rem 1.2rem;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn {
            width: 100%;
            padding: 0.85rem;
            border-radius: 12px;
            border: none;
            background: var(--accent);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .switch-prompt {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.87rem;
            color: var(--text-muted);
        }

        .switch-prompt a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .switch-prompt a:hover {
            text-decoration: underline;
        }

        .status-msg {
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.87rem;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }

        .status-msg.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="gateway-container" id="gatewayCard" data-csrf-token="">
        <div class="brand">
            <h1>NEXUS</h1>
            <p>End-to-End Enterprise Messaging</p>
        </div>

        <!-- System Message Bar for validation errors -->
        <div class="status-msg" id="statusBox"></div>

        <!-- LOGIN PANEL -->
        <div class="form-panel active" id="loginPanel">
            <form id="loginForm" autocomplete="off">
                <div class="input-group">
                    <label for="loginUser">Email or Username</label>
                    <input type="text" id="loginUser" required placeholder="Enter credentials">
                </div>
                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>
            <div class="switch-prompt">
                New to Nexus? <a href="#" onclick="switchPanel('registerPanel')">Create an account</a>
            </div>
        </div>

        <!-- REGISTRATION PANEL -->
        <div class="form-panel" id="registerPanel">
            <form id="registerForm" autocomplete="off">
                <div class="input-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" required minlength="3" maxlength="30" placeholder="johndoe">
                </div>
                <div class="input-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" required placeholder="you@example.com">
                </div>
                <div class="input-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" required minlength="8" placeholder="Minimum 8 characters">
                </div>
                <button type="submit" class="btn">Register</button>
            </form>
            <div class="switch-prompt">
                Already have an account? <a href="#" onclick="switchPanel('loginPanel')">Sign in</a>
            </div>
        </div>
    </div>

    <script>
        // Smooth panel toggle logic
        function switchPanel(panelId) {
            document.querySelectorAll('.form-panel').forEach(panel => {
                panel.classList.remove('active');
            });
            document.getElementById(panelId).classList.add('active');
            document.getElementById('statusBox').style.display = 'none';
        }

        // Frontend logic placeholder to be bound to auth.js handling async requests
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            // Ready for secure Fetch request to /api/auth/login
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            // Ready for secure Fetch request to /api/auth/register
        });
    </script>
</body>
</html>
