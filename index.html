<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEXTNEXUS OS // V6.0 EXECUTIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #08090E;
            --panel-bg: rgba(15, 20, 32, 0.85);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-blue: #38BDF8;
            --accent-indigo: #6366F1;
            --status-green: #10B981;
            --status-red: #EF4444;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;

            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER HUD */
        header.nexus-hud {
            background: rgba(10, 14, 23, 0.9);
            border-bottom: 1px solid var(--panel-border);
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .hud-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hud-brand-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #FFF;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .hud-brand-text .logo {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.3px;
            color: #FFF;
        }

        .system-badge {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--accent-blue);
        }

        /* USER AUTH STATUS */
        .hud-auth-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 11px;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 14px;
            border: 1px solid var(--panel-border);
            border-radius: 20px;
        }

        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--status-red);
        }

        .status-dot.active { background: var(--status-green); box-shadow: 0 0 8px var(--status-green); }

        .btn-hud-auth {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent-blue);
            font-size: 11px;
            font-weight: 700;
            padding: 8px 18px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .btn-hud-auth:hover {
            background: var(--accent-blue);
            color: #000;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        /* NAVIGATION DOCK */
        .nav-dock {
            background: rgba(8, 12, 20, 0.95);
            border-bottom: 1px solid var(--panel-border);
            padding: 8px 24px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #FFF;
        }

        .nav-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #000;
            font-weight: 700;
        }

        /* VIEWPORT CONTAINER */
        .viewport-container {
            flex: 1;
            margin: 10px;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            overflow: hidden;
            background: #000;
        }

        iframe#main-viewport {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* MODAL POPUP */
        #auth-modal-wrapper {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(4, 6, 12, 0.85);
            backdrop-filter: blur(20px);
            z-index: 60000;
            align-items: center;
            justify-content: center;
        }

        .auth-modal-card {
            width: 90%; max-width: 400px;
            background: rgba(15, 20, 32, 0.95);
            border: 1px solid var(--accent-blue);
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.2);
            border-radius: 16px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
    </style>
</head>
<body>

    <!-- MAIN HEADER HUD -->
    <header class="nexus-hud">
        <div class="hud-brand">
            <div class="hud-brand-icon">N</div>
            <div class="hud-brand-text">
                <div class="logo">TextNexus OS</div>
                <div class="system-badge">V6.0 EXECUTIVE ENGINE</div>
            </div>
        </div>

        <div class="hud-auth-section">
            <div class="user-pill">
                <div class="status-dot" id="auth-status-dot"></div>
                <span id="hud-user-email">GUEST_OPERATOR</span>
            </div>
            <button class="btn-hud-auth" id="btn-auth-trigger" onclick="handleAuthClick()">SIGN IN</button>
        </div>
    </header>

    <!-- NAVIGATION DOCK -->
    <div class="nav-dock">
        <button class="nav-btn active" onclick="switchPage('home.html', this)">🏠 Home</button>
        <button class="nav-btn" onclick="switchPage('dashboard.html', this)">📊 Dashboard</button>
        <button class="nav-btn" onclick="switchPage('ghostlink.html', this)">👻 GhostLink</button>
        <button class="nav-btn" onclick="switchPage('shoutouts.html', this)">📣 Shoutouts</button>
        <button class="nav-btn" onclick="switchPage('terminal.html', this)">💻 Terminal</button>
        <button class="nav-btn" onclick="switchPage('owner.html', this)">👑 Owner Panel</button>
    </div>

    <!-- MAIN PAGE VIEWPORT -->
    <div class="viewport-container">
        <iframe id="main-viewport" src="dashboard.html"></iframe>
    </div>

    <!-- SIGN IN MODAL -->
    <div id="auth-modal-wrapper">
        <div class="auth-modal-card">
            <h3 style="color:#FFF; font-size:16px;">🔐 System Authentication</h3>
            <p style="color:var(--text-muted); font-size:12px;">Sign in with your Google account to authorize session.</p>
            <button class="btn-hud-auth" id="btn-google-login" style="padding:12px; width:100%;">CONTINUE WITH GOOGLE</button>
            <button class="btn-hud-auth" onclick="closeAuthModal()" style="background:transparent; border-color:rgba(255,255,255,0.2); color:#FFF; padding:10px; width:100%;">DISMISS</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com",
            projectId: "nexus-web-development-official"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        const viewport = document.getElementById('main-viewport');
        const authModal = document.getElementById('auth-modal-wrapper');
        const userEmailDisplay = document.getElementById('hud-user-email');
        const authStatusDot = document.getElementById('auth-status-dot');
        const OWNER_EMAIL = "brodywilliams0226@gmail.com";
        let currentUser = null;

        window.switchPage = function(pageUrl, btnElement = null) {
            if (pageUrl === 'owner.html') {
                if (!currentUser || currentUser.email.toLowerCase() !== OWNER_EMAIL.toLowerCase()) {
                    alert(`⛔ Access Denied: You must be authenticated as ${OWNER_EMAIL} to open the Owner Panel.`);
                    return;
                }
            }
            viewport.src = pageUrl;
            document.querySelectorAll('.nav-dock .nav-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
        };

        window.handleAuthClick = function() {
            if (currentUser) {
                signOut(auth);
            } else {
                authModal.style.display = 'flex';
            }
        };

        window.closeAuthModal = function() { authModal.style.display = 'none'; };

        document.getElementById('btn-google-login').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, googleProvider);
                closeAuthModal();
            } catch (err) {
                alert(`Auth Failed: ${err.message}`);
            }
        });

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                userEmailDisplay.textContent = user.email.toUpperCase();
                authStatusDot.classList.add('active');
            } else {
                userEmailDisplay.textContent = "GUEST_OPERATOR";
                authStatusDot.classList.remove('active');
            }
        });
    </script>
</body>
</html>
