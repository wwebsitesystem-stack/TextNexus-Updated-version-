<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEXTNEXUS V5.0</title>
  <!-- Google Fonts for Cyberpunk/HUD styling -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --cyan: #00F5D4;
      --cyan-glow: rgba(0, 245, 212, 0.4);
      --bg-black: #000000;
      --panel-bg: rgba(0, 15, 20, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: var(--bg-black);
      color: var(--cyan);
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
    }

    /* Outer Matrix Container */
    .hud-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* SVG Futuristic Border Overlay */
    .hud-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Header Bar */
    .hud-header {
      position: relative;
      z-index: 20;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 10px 40px;
    }

    .brand-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-shadow: 0 0 10px var(--cyan-glow);
    }

    /* Main Grid Layout */
    .hud-body {
      position: relative;
      z-index: 20;
      display: flex;
      flex: 1;
      padding: 20px 40px;
      gap: 30px;
    }

    /* Left Navigation Panel */
    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 240px;
    }

    .nav-row {
      display: flex;
      gap: 30px;
    }

    .nav-item {
      color: var(--cyan);
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      background: none;
      border: none;
      text-align: left;
      font-family: 'Orbitron', sans-serif;
    }

    .nav-item:hover {
      text-shadow: 0 0 12px var(--cyan);
      transform: translateX(4px);
    }

    /* Dynamic Content Viewing Area */
    .viewport-panel {
      flex: 1;
      border: 1px solid rgba(0, 245, 212, 0.2);
      background: rgba(0, 10, 15, 0.6);
      position: relative;
      border-radius: 4px;
      overflow: hidden;
    }

    .viewport-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    /* Bottom Action & Status Footer */
    .hud-footer {
      position: relative;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 10px 40px;
    }

    .status-display {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9rem;
      opacity: 0.8;
      display: flex;
      gap: 15px;
    }

    .status-tag {
      padding: 4px 8px;
      border: 1px solid var(--cyan);
      background: rgba(0, 245, 212, 0.1);
    }

    .sign-in-btn {
      color: var(--cyan);
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 2px;
      cursor: pointer;
      background: transparent;
      border: none;
      font-family: 'Orbitron', sans-serif;
      transition: all 0.2s ease;
    }

    .sign-in-btn:hover {
      text-shadow: 0 0 15px var(--cyan);
      transform: scale(1.05);
    }

    /* Boot & Diagnostic Loader Overlay */
    #boot-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-black);
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Share Tech Mono', monospace;
    }

    .spinner {
      width: 70px;
      height: 70px;
      border: 4px solid rgba(0, 245, 212, 0.1);
      border-top: 4px solid var(--cyan);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Maintenance Mode Lockout Screen */
    #maintenance-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-black);
      z-index: 9999;
      display: none;
      width: 100vw;
      height: 100vh;
    }

    #maintenance-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Authentication Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 500;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .terminal-card {
      width: 420px;
      background: #020D12;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 20px var(--cyan-glow);
      padding: 25px;
      font-family: 'Share Tech Mono', monospace;
    }

    .terminal-header {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--cyan);
      padding-bottom: 8px;
    }

    .auth-btn {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: rgba(0, 245, 212, 0.1);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-family: 'Orbitron', sans-serif;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .auth-btn:hover {
      background: var(--cyan);
      color: var(--bg-black);
    }

    .close-modal {
      background: transparent;
      border: none;
      color: #888;
      cursor: pointer;
      float: right;
    }
  </style>
</head>
<body>

  <!-- Futuristic SVG Frame Lines -->
  <svg class="hud-frame" xmlns="http://www.w3.org/2000/svg">
    <!-- Top Left Decorator -->
    <path d="M 40 40 L 40 80 L 120 80 L 150 40 L 500 40" stroke="#00F5D4" stroke-width="2" fill="none" />
    <circle cx="40" cy="40" r="3" fill="#00F5D4" />
    <!-- Top-Left Star Symbol -->
    <text x="50" y="32" fill="#00F5D4" font-size="28" font-family="Orbitron">✳</text>

    <!-- Top Slanted Stripes -->
    <line x1="160" y1="48" x2="175" y2="68" stroke="#00F5D4" stroke-width="4" />
    <line x1="175" y1="48" x2="190" y2="68" stroke="#00F5D4" stroke-width="4" />
    <line x1="190" y1="48" x2="205" y2="68" stroke="#00F5D4" stroke-width="4" />

    <!-- Main Outer Border Wireframe -->
    <rect x="25" y="25" width="calc(100% - 50px)" height="calc(100% - 50px)" stroke="#00F5D4" stroke-width="2" fill="none" rx="2" />

    <!-- Bottom Right Decorator -->
    <path d="M calc(100% - 40px) calc(100% - 40px) L calc(100% - 40px) calc(100% - 80px) L calc(100% - 120px) calc(100% - 80px) L calc(100% - 150px) calc(100% - 40px) L calc(100% - 500px) calc(100% - 40px)" stroke="#00F5D4" stroke-width="2" fill="none" />
    <circle cx="calc(100% - 40px)" cy="calc(100% - 40px)" r="3" fill="#00F5D4" />
    <!-- Bottom-Right Star Symbol -->
    <text x="calc(100% - 70px)" y="calc(100% - 15px)" fill="#00F5D4" font-size="28" font-family="Orbitron">✳</text>
  </svg>

  <!-- Initial Boot Loading Diagnostic Screen -->
  <div id="boot-screen">
    <div class="spinner"></div>
    <div id="boot-log">> INITIALIZING TEXTNEXUS V5.0 CORE SYSTEM...</div>
  </div>

  <!-- Fullscreen Un-dismissable Maintenance Screen -->
  <div id="maintenance-overlay">
    <iframe id="maintenance-frame" src="maintenance.html"></iframe>
  </div>

  <!-- Main HUD Page Layout -->
  <div class="hud-container">
    <!-- Header -->
    <header class="hud-header">
      <div class="brand-title">TEXTNEXUS &nbsp;V5.0</div>
    </header>

    <!-- Main Content Body -->
    <div class="hud-body">
      <!-- Left Cyber Navigation Menu -->
      <nav class="nav-menu">
        <div class="nav-row">
          <button class="nav-item" onclick="loadPage('Home.html')">HOME</button>
          <button class="nav-item" onclick="loadPage('More.html')">MORE</button>
        </div>
        <button class="nav-item" onclick="loadPage('Updates.html')">UPDATES</button>
        <button class="nav-item" onclick="loadPage('Shoutout.html')">SHOUTOUTS</button>
        <button class="nav-item" onclick="loadPage('GhostLink.html')">GHOSTLINK</button>
        <button class="nav-item" onclick="loadPage('Textnexus.html')">TEXTNEXUS</button>
        <button class="nav-item" onclick="loadPage('all_about_the_owner.html')">OWNER</button>
        <button class="nav-item" onclick="loadPage('ai-core.html')">AI CORE MATRIX</button>
      </nav>

      <!-- Sub-page Viewport Frame -->
      <main class="viewport-panel">
        <iframe id="content-viewport" class="viewport-iframe" src="Home.html"></iframe>
      </main>
    </div>

    <!-- Footer Controls & Realtime Status -->
    <footer class="hud-footer">
      <div class="status-display">
        <div class="status-tag">SYSTEM: <span id="sys-command">SYNCING...</span></div>
        <div class="status-tag">USER: <span id="user-status">ANONYMOUS</span></div>
      </div>
      <button class="sign-in-btn" onclick="openAuthModal()">SIGN IN</button>
    </footer>
  </div>

  <!-- Authentication Modal Window -->
  <div id="auth-modal" class="modal-overlay">
    <div class="terminal-card">
      <button class="close-modal" onclick="closeAuthModal()">✕</button>
      <div class="terminal-header">> TERMINAL SIGN-IN</div>
      <p style="margin-bottom: 15px; color: #888;">Select authentication vector:</p>
      <button class="auth-btn" onclick="signInGoogle()">GOOGLE TERMINAL</button>
      <button class="auth-btn" onclick="signInApple()">APPLE TERMINAL</button>
      <div id="auth-log" style="margin-top: 10px; font-size: 0.8rem; color: var(--cyan);"></div>
    </div>
  </div>

  <!-- Firebase Modular SDK Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, OAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
      authDomain: "nexus-web-development-official.firebaseapp.com",
      databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com",
      projectId: "nexus-web-development-official",
      storageBucket: "nexus-web-development-official.firebasestorage.app",
      messagingSenderId: "553556577139",
      appId: "1:553556577139:web:ea4469b06c2c01cc999306",
      measurementId: "G-S6K1M5PZLE"
    };

    // Initialize Services
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Boot Diagnostic Sequence
    window.addEventListener('DOMContentLoaded', () => {
      const bootLog = document.getElementById('boot-log');
      setTimeout(() => { bootLog.innerText = "> CONNECTING TO REALTIME DATABASE..."; }, 600);
      setTimeout(() => { bootLog.innerText = "> VERIFYING SYSTEM STATUS..."; }, 1200);
      setTimeout(() => {
        document.getElementById('boot-screen').style.display = 'none';
      }, 1800);
    });

    // Realtime Database Listener for System Control (/system)
    const systemRef = ref(db, 'system');
    onValue(systemRef, (snapshot) => {
      const data = snapshot.val() || {};
      const command = data.command || 'online';
      
      // Update System Display Tag
      document.getElementById('sys-command').innerText = command.toUpperCase();

      // Check Maintenance Mode Condition
      const maintenanceOverlay = document.getElementById('maintenance-overlay');
      if (command.toLowerCase() === 'maintenance') {
        maintenanceOverlay.style.display = 'block';
      } else {
        maintenanceOverlay.style.display = 'none';
      }
    }, (error) => {
      console.warn("RTDB Sync Notice:", error);
      document.getElementById('sys-command').innerText = "ONLINE";
    });

    // Navigation Switcher Function
    window.loadPage = function(targetHtml) {
      document.getElementById('content-viewport').src = targetHtml;
    };

    // Modal Control Functions
    window.openAuthModal = function() {
      document.getElementById('auth-modal').style.display = 'flex';
    };
    window.closeAuthModal = function() {
      document.getElementById('auth-modal').style.display = 'none';
    };

    // Authentication Handlers
    window.signInGoogle = function() {
      const provider = new GoogleAuthProvider();
      document.getElementById('auth-log').innerText = "> CONNECTING GOOGLE AUTH...";
      signInWithPopup(auth, provider)
        .then((result) => {
          document.getElementById('user-status').innerText = result.user.displayName || "AUTHENTICATED";
          closeAuthModal();
        })
        .catch((err) => {
          document.getElementById('auth-log').innerText = "> ERROR: " + err.message;
        });
    };

    window.signInApple = function() {
      const provider = new OAuthProvider('apple.com');
      document.getElementById('auth-log').innerText = "> CONNECTING APPLE AUTH...";
      signInWithPopup(auth, provider)
        .then((result) => {
          document.getElementById('user-status').innerText = result.user.displayName || "AUTHENTICATED";
          closeAuthModal();
        })
        .catch((err) => {
          document.getElementById('auth-log').innerText = "> ERROR: " + err.message;
        });
    };
  </script>
</body>
</html>
