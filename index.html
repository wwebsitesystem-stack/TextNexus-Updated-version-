<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextNexus OS // Premium Edition</title>
    <!-- High-End Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Luxury Dark Palette */
            --bg-base: #000000;
            --bg-surface: #0a0a0a;
            --glass-panel: rgba(10, 10, 10, 0.65);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-hover: rgba(255, 255, 255, 0.1);
            
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --text-tertiary: #555555;
            
            --accent-primary: #ffffff;
            --accent-glow: rgba(255, 255, 255, 0.15);
            
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            user-select: none; -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* --------------------------------------
           1. CINEMATIC BOOT SEQUENCE
        --------------------------------------- */
        #boot-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.2s var(--ease-out-expo), transform 1.2s var(--ease-out-expo);
        }

        .boot-logo-container {
            position: relative;
            width: 60px; height: 60px;
            margin-bottom: 24px;
        }

        .boot-ring {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: pulseRing 2s infinite ease-in-out;
        }

        .boot-ring::before {
            content: ''; position: absolute;
            top: -1px; left: 50%; width: 2px; height: 10px;
            background: #fff; transform: translateX(-50%);
            box-shadow: 0 0 10px #fff;
            animation: spinRing 2s infinite linear;
            transform-origin: 50% 31px;
        }

        .boot-text {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 4px;
            color: var(--text-secondary);
            text-transform: uppercase;
            animation: textGlow 2s infinite alternate;
        }

        @keyframes spinRing { 100% { transform: translateX(-50%) rotate(360deg); } }
        @keyframes pulseRing { 0%, 100% { transform: scale(0.95); opacity: 0.5; } 50% { transform: scale(1.05); opacity: 1; } }
        @keyframes textGlow { 0% { opacity: 0.5; } 100% { opacity: 1; text-shadow: 0 0 8px rgba(255,255,255,0.3); } }

        .boot-hidden {
            opacity: 0;
            transform: scale(1.02);
            pointer-events: none;
        }

        /* --------------------------------------
           2. AMBIENT BACKGROUND & LAYOUT
        --------------------------------------- */
        .ambient-mesh {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.03) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }

        .app-layout {
            display: flex;
            width: 100%; height: 100%;
            position: relative; z-index: 1;
            padding: 16px;
            gap: 16px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 1s var(--ease-out-expo) 0.3s;
        }

        .app-layout.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        /* --------------------------------------
           3. PREMIUM SIDEBAR
        --------------------------------------- */
        aside.sidebar {
            width: 260px;
            background: var(--glass-panel);
            backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .brand {
            display: flex; align-items: center; gap: 12px;
            padding: 0 8px 24px 8px;
        }

        .brand-icon {
            width: 28px; height: 28px;
            border-radius: 8px;
            background: #fff;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }
        .brand-icon svg { width: 16px; height: 16px; fill: #000; }

        .brand-text h1 { font-size: 14px; font-weight: 600; color: #fff; letter-spacing: -0.3px; }
        .brand-text span { font-size: 10px; font-family: var(--font-mono); color: var(--text-secondary); }

        .nav-group { margin-bottom: 24px; }
        .nav-label {
            font-size: 10px; font-weight: 500;
            color: var(--text-tertiary);
            text-transform: uppercase; letter-spacing: 1.5px;
            padding: 0 12px; margin-bottom: 8px;
        }

        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px; margin-bottom: 4px;
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 13px; font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .nav-item svg {
            width: 16px; height: 16px;
            stroke: currentColor; fill: none; stroke-width: 1.8;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .nav-item:hover { background: var(--glass-hover); color: var(--text-primary); }

        .nav-item.active {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* --------------------------------------
           4. MAIN VIEWPORT & HEADER
        --------------------------------------- */
        main.main-area {
            flex: 1; display: flex; flex-direction: column;
            gap: 16px; min-width: 0;
        }

        header.top-hud {
            height: 60px;
            background: var(--glass-panel);
            backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .hud-left {
            display: flex; align-items: center; gap: 12px;
        }

        .cmd-button {
            display: flex; align-items: center; gap: 40px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            padding: 8px 12px 8px 16px;
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer; transition: all 0.2s;
        }
        .cmd-button:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: rgba(255,255,255,0.15); }
        .cmd-kbd { font-family: var(--font-mono); font-size: 10px; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; color: #fff;}

        .hud-right {
            display: flex; align-items: center; gap: 20px;
        }

        .system-time {
            font-family: var(--font-mono);
            font-size: 12px; color: var(--text-secondary);
            display: flex; align-items: center; gap: 8px;
        }
        .pulse-dot {
            width: 6px; height: 6px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 8px #fff;
            animation: pulseStatus 2s infinite;
        }
        @keyframes pulseStatus { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        .auth-pill {
            display: flex; align-items: center; gap: 10px;
            background: transparent; border: 1px solid var(--glass-border);
            padding: 6px 6px 6px 14px; border-radius: 20px;
            cursor: pointer; transition: all 0.2s;
        }
        .auth-pill:hover { background: var(--glass-hover); border-color: rgba(255,255,255,0.2); }
        .auth-text { font-size: 12px; font-weight: 500; color: #fff; }
        .auth-avatar { width: 24px; height: 24px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .auth-avatar svg { width: 12px; height: 12px; fill: #000; }

        .iframe-wrapper {
            flex: 1;
            background: #000;
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        iframe#nexus-viewport {
            width: 100%; height: 100%; border: none;
            transition: opacity 0.3s var(--ease-out-expo), transform 0.3s var(--ease-out-expo);
        }
        iframe#nexus-viewport.loading { opacity: 0; transform: scale(0.98); }

        /* --------------------------------------
           5. COMMAND PALETTE (RAYCAST STYLE)
        --------------------------------------- */
        #cmd-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); z-index: 10000;
            align-items: flex-start; justify-content: center; padding-top: 12vh;
            opacity: 0; transition: opacity 0.2s ease;
        }

        #cmd-overlay.active { opacity: 1; }

        .cmd-modal {
            width: 100%; max-width: 640px;
            background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            overflow: hidden; transform: scale(0.95); transition: transform 0.2s var(--ease-out-expo);
        }
        #cmd-overlay.active .cmd-modal { transform: scale(1); }

        .cmd-input-area {
            display: flex; align-items: center; padding: 20px 24px;
            border-bottom: 1px solid var(--glass-border); gap: 16px;
        }
        .cmd-input-area svg { width: 20px; height: 20px; stroke: var(--text-secondary); fill: none; stroke-width: 2; }
        .cmd-input {
            flex: 1; background: transparent; border: none; outline: none;
            color: #fff; font-size: 18px; font-family: var(--font-sans); font-weight: 300;
        }
        .cmd-input::placeholder { color: var(--text-tertiary); }

        .cmd-results { max-height: 360px; overflow-y: auto; padding: 12px; }
        .cmd-results::-webkit-scrollbar { display: none; }
        .cmd-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; border-radius: 10px;
            color: var(--text-secondary); font-size: 13px; font-weight: 500;
            cursor: pointer; transition: all 0.1s;
        }
        .cmd-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .cmd-item-left { display: flex; align-items: center; gap: 12px; }
        .cmd-item-left svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
    </style>
</head>
<body>

    <!-- BOOT SEQUENCE OVERLAY -->
    <div id="boot-screen">
        <div class="boot-logo-container">
            <div class="boot-ring"></div>
        </div>
        <div class="boot-text">TextNexus OS // Init // TEXTNEXUS OS 6.0</div>
    </div>

    <!-- AMBIENT MESH BACKGROUND -->
    <div class="ambient-mesh"></div>

    <!-- MAIN OS LAYOUT -->
    <div class="app-layout" id="app-root">
        
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div>
                <div class="brand">
                    <div class="brand-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    </div>
                    <div class="brand-text">
                        <h1>TextNexus</h1>
                        <span>OS // EDITION X // TEXTNEXUS OS 6.0</span>
                    </div>
                </div>

                <div class="nav-group">
                    <div class="nav-label">Workspace</div>
                    <div class="nav-item active" onclick="loadRoute('home.html', this)">
                        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                        Overview
                    </div>
                    <div class="nav-item" onclick="loadRoute('dashboard.html', this)">
                        <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                        Telemetry
                    </div>
                    <div class="nav-item" onclick="loadRoute('ghostlink.html', this)">
                        <svg viewBox="0 0 24 24"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="6.5"/></svg>
                        GhostLink
                    </div>
                </div>

                <div class="nav-group">
                    <div class="nav-label">System</div>
                    <div class="nav-item" onclick="loadRoute('terminal.html', this)">
                        <svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                        Terminal CLI
                    </div>
                    <div class="nav-item" onclick="loadRoute('Preview.html', this)">
                        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>Coming Soon</svg>
                        Coming Soon
                    </div>
                </div>
            </div>

            <div class="system-time">
                <div class="pulse-dot"></div>
                <span id="live-clock">SYNCING...</span>
            </div>
        </aside>

        <!-- MAIN AREA -->
        <main class="main-area">
            
            <!-- TOP HUD -->
            <header class="top-hud">
                <div class="hud-left">
                    <div class="cmd-button" onclick="toggleCmd()">
                        <span>Search commands...</span>
                        <span class="cmd-kbd">⌘K</span>
                    </div>
                </div>

                <div class="hud-right">
                    <div class="auth-pill" id="auth-btn" onclick="handleAuth()">
                        <span class="auth-text" id="auth-label">Sign In</span>
                        <div class="auth-avatar">
                            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                    </div>
                </div>
            </header>

            <!-- IFRAME VIEWPORT -->
            <div class="iframe-wrapper">
                <iframe id="nexus-viewport" src="home.html"></iframe>
            </div>

        </main>
    </div>

    <!-- COMMAND PALETTE (RAYCAST CLONE) -->
    <div id="cmd-overlay" onclick="if(event.target===this) toggleCmd()">
        <div class="cmd-modal">
            <div class="cmd-input-area">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="cmd-input" id="cmd-input" placeholder="What do you need?" autocomplete="off">
            </div>
            <div class="cmd-results">
                <div class="nav-label" style="padding: 0 4px; margin-top: 8px;">Quick Actions</div>
                <div class="cmd-item" onclick="execCmd('home.html')">
                    <div class="cmd-item-left"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Go to Overview</div>
                    <span class="cmd-kbd">↵</span>
                </div>
                <div class="cmd-item" onclick="execCmd('dashboard.html')">
                    <div class="cmd-item-left"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> Go to Telemetry</div>
                    <span class="cmd-kbd">↵</span>
                </div>
                <div class="cmd-item" onclick="execCmd('')">
                    <div class="cmd-item-left"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Coming Soon</div>
                    <span class="cmd-kbd">↵</span>
                </div>
            </div>
        </div>
    </div>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

        // BOOT SEQUENCE LOGIC
        window.addEventListener('load', () => {
            setTimeout(() => {
                const boot = document.getElementById('boot-screen');
                const app = document.getElementById('app-root');
                boot.classList.add('boot-hidden');
                setTimeout(() => {
                    boot.style.display = 'none';
                    app.classList.add('loaded');
                }, 1200);
            }, 2200); // Wait 2.2 seconds for cinematic effect
        });

        // LIVE CLOCK
        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').textContent = now.toLocaleTimeString('en-US', { hour12: false }) + ' UTC';
        }, 1000);

        // ROUTING LOGIC
        const viewport = document.getElementById('nexus-viewport');
        window.loadRoute = function(url, navElement = null) {
            // UI Update
            if(navElement) {
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                navElement.classList.add('active');
            }
            // Iframe Transition
            viewport.classList.add('loading');
            setTimeout(() => {
                viewport.src = url;
                setTimeout(() => viewport.classList.remove('loading'), 100);
            }, 300);
        };

        // COMMAND PALETTE LOGIC
        const cmdOverlay = document.getElementById('cmd-overlay');
        const cmdInput = document.getElementById('cmd-input');
        
        window.toggleCmd = function() {
            const isActive = cmdOverlay.classList.contains('active');
            if (isActive) {
                cmdOverlay.classList.remove('active');
                setTimeout(() => cmdOverlay.style.display = 'none', 200);
            } else {
                cmdOverlay.style.display = 'flex';
                // Trigger reflow for transition
                cmdOverlay.offsetHeight; 
                cmdOverlay.classList.add('active');
                cmdInput.value = '';
                cmdInput.focus();
            }
        };

        window.execCmd = function(url) {
            loadRoute(url);
            toggleCmd();
        };

        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                toggleCmd();
            }
            if (e.key === 'Escape' && cmdOverlay.classList.contains('active')) {
                toggleCmd();
            }
        });

        // FIREBASE AUTHENTICATION (Minimal Config)
        const firebaseConfig = {
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            projectId: "nexus-web-development-official"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        const authLabel = document.getElementById('auth-label');

        window.handleAuth = function() {
            if (currentUser) {
                if(confirm("Disconnect active session?")) signOut(auth);
            } else {
                signInWithPopup(auth, provider).catch(err => console.error(err));
            }
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                const name = user.email.split('@')[0];
                authLabel.textContent = name.length > 10 ? name.substring(0,10) + '...' : name;
            } else {
                authLabel.textContent = "Sign In";
            }
        });
    </script>
</body>
</html>
