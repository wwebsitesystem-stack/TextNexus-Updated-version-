<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus // System Portal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #07050a;
            --bg-surface: #0f0a17;
            --glass-panel: rgba(23, 15, 38, 0.65);
            --glass-border: rgba(168, 85, 247, 0.25);
            --glass-hover: rgba(168, 85, 247, 0.15);
            
            --text-primary: #ffffff;
            --text-secondary: #adabb8;
            --text-tertiary: #6e677a;
            
            --purple-primary: #a855f7;
            --purple-light: #c084fc;
            --purple-dark: #7e22ce;
            --purple-glow: rgba(168, 85, 247, 0.4);
            
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            user-select: none; -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(126, 34, 206, 0.1) 0%, transparent 40%);
        }

        .header {
            height: 64px;
            padding: 0 32px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(7, 5, 10, 0.8);
            backdrop-filter: blur(12px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
        }

        .brand-logo {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--purple-light), var(--purple-dark));
            box-shadow: 0 0 12px var(--purple-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 14px;
            color: #fff;
        }

        .brand-title {
            font-size: 16px;
            font-weight: 600;
        }

        .brand-title span { color: var(--purple-primary); }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--glass-panel);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 28px;
            backdrop-filter: blur(10px);
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--purple-light);
        }

        .panel-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-input, .form-select {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-family: var(--font-sans);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--purple-primary);
        }

        .btn-purple {
            width: 100%;
            background: linear-gradient(135deg, var(--purple-primary), var(--purple-dark));
            color: #fff;
            border: 1px solid var(--purple-light);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
            transition: all 0.2s;
            margin-top: 8px;
        }

        .btn-purple:hover {
            box-shadow: 0 0 22px rgba(168, 85, 247, 0.5);
            transform: translateY(-1px);
        }

        .user-status {
            padding: 12px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid var(--purple-primary);
            border-radius: 10px;
            margin-bottom: 20px;
            font-family: var(--font-mono);
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-role {
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.5);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="brand">
            <div class="brand-logo">N</div>
            <div class="brand-title">NEXUS<span>//</span>PORTAL</div>
        </a>
        <a href="textnexus_communication_platform.html" class="btn-purple" style="width: auto; padding: 8px 16px;">Launch TextNexus</a>
    </header>

    <div class="container">
        <!-- AUTH PANEL -->
        <div class="panel">
            <h2 class="panel-title">1. Account Authentication</h2>
            <p class="panel-desc">Sign in or create a account to enable your TextNexus identity.</p>

            <div id="auth-status-box" class="user-status" style="display: none;">
                <span id="auth-user-email">Not Signed In</span>
                <button onclick="handleSignOut()" style="background:transparent; border:none; color:var(--purple-light); cursor:pointer; font-family:var(--font-mono); font-size:11px;">[ Sign Out ]</button>
            </div>

            <div id="auth-form">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="auth-email" class="form-input" placeholder="user@nexus.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="auth-password" class="form-input" placeholder="••••••••">
                </div>
                <button class="btn-purple" onclick="handleSignIn()">Sign In / Register</button>
            </div>
        </div>

        <!-- PROFILE & ROLE PANEL -->
        <div class="panel">
            <h2 class="panel-title">2. Profile & Role Setup</h2>
            <p class="panel-desc">Configure your display name and role. Setting yourself as <b>Owner</b> will attach the Owner badge to your TextNexus messages.</p>

            <div class="form-group">
                <label class="form-label">Username / Display Name</label>
                <input type="text" id="profile-username" class="form-input" placeholder="e.g. Alex_Nexus">
            </div>

            <div class="form-group">
                <label class="form-label">System Role</label>
                <select id="profile-role" class="form-select">
                    <option value="Owner">Owner</option>
                    <option value="Admin">Admin</option>
                    <option value="Developer">Developer</option>
                    <option value="Member" selected>Member</option>
                </select>
            </div>

            <button class="btn-purple" onclick="saveProfile()">Save Identity Profile</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            projectId: "nexus-web-development-official"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('auth-status-box').style.display = 'flex';
                document.getElementById('auth-user-email').textContent = user.email;
                document.getElementById('auth-form').style.display = 'none';

                // Fetch existing profile
                try {
                    const userSnap = await getDoc(doc(db, "users", user.uid));
                    if (userSnap.exists()) {
                        const data = userSnap.data();
                        if (data.username) document.getElementById('profile-username').value = data.username;
                        if (data.role) document.getElementById('profile-role').value = data.role;
                    }
                } catch (e) {
                    console.error("Error loading user profile:", e);
                }
            } else {
                document.getElementById('auth-status-box').style.display = 'none';
                document.getElementById('auth-form').style.display = 'block';
            }
        });

        window.handleSignIn = async function() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if (!email || !password) {
                alert("Please fill in both email and password.");
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                // If user doesn't exist, automatically create an account
                try {
                    await createUserWithEmailAndPassword(auth, email, password);
                } catch (createErr) {
                    alert("Authentication error: " + createErr.message);
                }
            }
        };

        window.handleSignOut = function() {
            signOut(auth);
        };

        window.saveProfile = async function() {
            if (!currentUser) {
                alert("Please sign in first before saving your profile.");
                return;
            }

            const username = document.getElementById('profile-username').value.trim() || currentUser.email.split('@')[0];
            const role = document.getElementById('profile-role').value;

            try {
                await setDoc(doc(db, "users", currentUser.uid), {
                    username: username,
                    role: role,
                    email: currentUser.email
                }, { merge: true });

                alert(`Profile updated! Registered as [${role}] ${username}`);
            } catch (err) {
                console.error("Error saving profile:", err);
                alert("Failed to save profile: " + err.message);
            }
        };
    </script>
</body>
</html>
