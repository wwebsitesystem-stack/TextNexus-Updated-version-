<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Modern Experience</title>
    <!-- Google Fonts for Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Variables for design consistency */
        :root {
            --bg-color: #0b0c10;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --primary-gradient: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --button-bg: #6366f1;
            --button-hover: #4f46e5;
        }

        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Effect in background */
        .ambient-glow {
            position: absolute;
            top: -200px;
            left: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* Navigation Header */
        header {
            position: relative;
            z-index: 10;
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .logo span {
            color: var(--button-bg);
        }

        /* Main Hero Section */
        main {
            position: relative;
            z-index: 10;
            padding: 2rem 5%;
            max-width: 900px;
            margin: 0 auto 0 0; /* Align left matching original structure */
        }

        .hero-title {
            font-size: clamp(3rem, 6vw, 5.5rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -2px;
            margin-bottom: 1.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-description {
            font-size: clamp(1.1rem, 2vw, 1.35rem);
            color: var(--text-muted);
            font-weight: 300;
            line-height: 1.6;
            max-width: 600px;
            margin-bottom: 2.5rem;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            padding: 0.85rem 1.75rem;
            background-color: var(--button-bg);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }

        .cta-button:hover {
            background-color: var(--button-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.4);
        }

        /* Footer Section */
        footer {
            position: relative;
            z-index: 10;
            padding: 2.5rem 5%;
            display: flex;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(11, 12, 16, 0.8);
            backdrop-filter: blur(10px);
        }

        .contact-card {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 0.75rem 1.25rem;
            border-radius: 50px;
            font-size: 0.95rem;
            color: var(--text-muted);
            transition: border-color 0.2s ease;
        }

        .contact-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .contact-card .label {
            font-weight: 600;
            color: var(--text-main);
        }

        .email-link {
            color: var(--button-bg);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .email-link:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }

        /* SVG Icon styling */
        .mail-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--button-bg);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <!-- Subtle background visual highlight -->
    <div class="ambient-glow"></div>

    <!-- Top Bar Navigation -->
    <header>
        <div class="logo">NEXUS<span>.</span></div>
    </header>

    <!-- Main Hero Content -->
    <main>
        <h1 class="hero-title">Welcome to Nexus</h1>
        <p class="hero-description">
            Experience seamless digital integration with Nexus. Built to empower your workflow with high-performance tools and modern simplicity.
        </p>
        <a href="mailto:Nexus.official.owner@outlook.com" class="cta-button">
            Get Started
        </a>
    </main>

    <!-- Modern Footer Container -->
    <footer>
        <div class="contact-card">
            <svg class="mail-icon" viewBox="0 0 24 24">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <span class="label">Contact Support:</span>
            <a href="mailto:Nexus.official.owner@outlook.com" class="email-link">
                Nexus.official.owner@outlook.com
            </a>
        </div>
    </footer>

</body>
</html>
