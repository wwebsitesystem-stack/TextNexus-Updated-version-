<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Ai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        nexus: {
                            bg: '#0a0a0a',           /* Deep dark background */
                            panel: '#111111',        /* Slightly lighter for input/panels */
                            border: '#222222',       /* Subtle dark border */
                            borderHover: '#333333',
                            text: '#ececec',         /* Off-white text */
                            muted: '#888888',        /* Muted gray text */
                            userBubble: '#1a1a1a',   /* Distinct background for user */
                            aiBubble: '#111111',     /* Distinct background for AI */
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            background-color: #0a0a0a; 
            color: #ececec; 
            font-family: 'Inter', sans-serif; 
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #444444; }
        .hide-scroll { scrollbar-width: none; -ms-overflow-style: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }

        /* Markdown Styles for AI Output */
        .markdown-content p { margin-bottom: 0.75rem; line-height: 1.6; }
        .markdown-content p:last-child { margin-bottom: 0; }
        .markdown-content strong { color: #ffffff; font-weight: 600; }
        .markdown-content pre { 
            background: #000000; 
            border: 1px solid #222222; 
            padding: 1rem; 
            border-radius: 0.5rem; 
            overflow-x: auto; 
            margin: 0.75rem 0; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.85rem; 
        }
        .markdown-content code { 
            background: rgba(255,255,255,0.05); 
            padding: 0.2rem 0.4rem; 
            border-radius: 0.25rem; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.85em; 
            border: 1px solid #222222;
        }
        .markdown-content pre code { background: transparent; padding: 0; border: none; }
        .markdown-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-content ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        
        /* Loading Dot Animation */
        .dot-flashing {
            position: relative; width: 6px; height: 6px; border-radius: 5px;
            background-color: #888888; color: #888888;
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: 0.5s;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: ""; display: inline-block; position: absolute; top: 0;
            width: 6px; height: 6px; border-radius: 5px;
            background-color: #888888; color: #888888;
            animation: dot-flashing 1s infinite alternate;
        }
        .dot-flashing::before { left: -10px; animation-delay: 0s; }
        .dot-flashing::after { left: 10px; animation-delay: 1s; }
        @keyframes dot-flashing {
            0% { background-color: #888888; }
            50%, 100% { background-color: rgba(136, 136, 136, 0.2); }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col selection:bg-nexus-borderHover selection:text-white">

    <!-- Top Header -->
    <header class="h-16 flex items-center justify-center border-b border-nexus-border bg-nexus-bg/90 backdrop-blur-md z-20 flex-shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-7 h-7 rounded bg-white flex items-center justify-center">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="black" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" />
                    <path d="M2 12L12 17L22 12" stroke="black" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="black" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="flex flex-col">
                <h1 class="text-white font-semibold leading-none tracking-tight">Nexus Ai</h1>
                <span class="text-[0.6rem] font-mono text-nexus-muted tracking-widest mt-1 uppercase">v6.0 Core Interface</span>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-8 flex flex-col relative hide-scroll" id="chat-container">
        <div class="max-w-3xl w-full mx-auto flex flex-col gap-6 pb-32" id="chat-history">
            
            <!-- Empty State / Greeting -->
            <div class="flex flex-col items-center justify-center text-center mt-12 mb-8 select-none" id="empty-state">
                <div class="w-16 h-16 rounded-2xl bg-nexus-panel border border-nexus-border flex items-center justify-center mb-4 shadow-lg shadow-black/50">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
                </div>
                <h2 class="text-2xl font-medium text-white mb-2 tracking-tight">System Initialized.</h2>
                <p class="text-nexus-muted font-mono text-xs max-w-sm">Secure terminal active. Upload imagery or input standard text commands to interface with the Nexus core.</p>
            </div>

            <!-- Messages injected here via JS -->
            
        </div>
        
        <div id="loading-indicator" class="hidden max-w-3xl w-full mx-auto items-start gap-4 mb-4">
            <div class="w-8 h-8 rounded-full bg-nexus-panel border border-nexus-border flex items-center justify-center flex-shrink-0 mt-1">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
            </div>
            <div class="bg-nexus-aiBubble border border-nexus-border rounded-2xl rounded-tl-none p-4 text-sm w-16 h-11 flex items-center justify-center">
                <div class="dot-flashing"></div>
            </div>
        </div>

        <div id="scroll-anchor"></div>
    </main>

    <footer class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-nexus-bg via-nexus-bg to-transparent pb-6 z-30">
        <div class="max-w-3xl mx-auto flex flex-col gap-2 relative">
            
            <!-- Image Preview Box -->
            <div id="preview-container" class="hidden self-start mb-2 bg-nexus-panel border border-nexus-border p-2 rounded-xl shadow-xl shadow-black relative group">
                <img id="image-preview" src="" alt="Upload preview" class="h-20 w-auto rounded-lg object-contain bg-black">
                <button id="remove-image-btn" class="absolute -top-2 -right-2 bg-nexus-border hover:bg-nexus-borderHover text-white p-1 rounded-full shadow-md transition-colors opacity-0 group-hover:opacity-100 focus:opacity-100" title="Remove attachment">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Main Input Container -->
            <div class="relative flex items-end bg-nexus-panel border border-nexus-border rounded-2xl shadow-xl shadow-black/50 transition-colors focus-within:border-[#444] focus-within:ring-1 focus-within:ring-[#444] overflow-hidden">
                
                <!-- File Upload Button -->
                <label class="p-3.5 cursor-pointer text-nexus-muted hover:text-white transition-colors flex-shrink-0" title="Upload Image">
                    <input type="file" id="file-upload" accept="image/*" class="hidden">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                </label>

                <!-- Textarea -->
                <textarea id="prompt-input" rows="1" class="flex-1 bg-transparent border-none focus:ring-0 resize-none py-3.5 px-2 text-sm max-h-40 placeholder-nexus-muted outline-none text-white font-sans hide-scroll" placeholder="Command Nexus Ai..."></textarea>

                <!-- Send Button -->
                <button id="submit-btn" class="p-3.5 text-nexus-muted hover:text-white transition-colors disabled:opacity-30 disabled:cursor-not-allowed flex-shrink-0" disabled>
                    <div class="bg-white/5 p-1.5 rounded-lg group-hover:bg-white/10 transition-colors border border-transparent">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </div>
                </button>
            </div>
            
            <div class="text-center mt-1">
                <span class="text-[10px] text-nexus-muted font-mono tracking-wider">SECURE CONNECTION // GEMINI AI CORE</span>
            </div>
        </div>
    </footer>

    <script>
        // The API Key provided by the user in the prompt
        const API_KEY = "sk-xt-169bcda28ecb06acee88d6c55d37b4fa2efc0770c066f6ff";
        
        const dom = {
            chatHistory: document.getElementById('chat-history'),
            input: document.getElementById('prompt-input'),
            submitBtn: document.getElementById('submit-btn'),
            fileInput: document.getElementById('file-upload'),
            previewContainer: document.getElementById('preview-container'),
            imagePreview: document.getElementById('image-preview'),
            removeImageBtn: document.getElementById('remove-image-btn'),
            scrollAnchor: document.getElementById('scroll-anchor'),
            loadingIndicator: document.getElementById('loading-indicator'),
            emptyState: document.getElementById('empty-state')
        };

        let state = {
            imageBase64: null,
            mimeType: null,
            conversation: [] 
        };

        dom.input.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            validateInput();
        });

        dom.input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!dom.submitBtn.disabled) {
                    processSubmission();
                }
            }
        });

        function validateInput() {
            const hasText = dom.input.value.trim().length > 0;
            const hasImage = state.imageBase64 !== null;
            dom.submitBtn.disabled = !(hasText || hasImage);
            
            const btnDiv = dom.submitBtn.querySelector('div');
            const btnSvg = dom.submitBtn.querySelector('svg');

            if (!dom.submitBtn.disabled) {
                btnDiv.classList.add('bg-white', 'border-white');
                btnDiv.classList.remove('bg-white/5', 'border-transparent');
                btnSvg.classList.add('text-black');
                btnSvg.classList.remove('text-white');
            } else {
                btnDiv.classList.remove('bg-white', 'border-white');
                btnDiv.classList.add('bg-white/5', 'border-transparent');
                btnSvg.classList.remove('text-black');
                btnSvg.classList.add('text-white');
            }
        }

        dom.fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    state.imageBase64 = event.target.result;
                    state.mimeType = file.type;
                    
                    dom.imagePreview.src = state.imageBase64;
                    dom.previewContainer.classList.remove('hidden');
                    validateInput();
                    
                    dom.fileInput.value = ''; 
                };
                reader.readAsDataURL(file);
            }
        });

        dom.removeImageBtn.addEventListener('click', clearImageState);

        function clearImageState() {
            state.imageBase64 = null;
            state.mimeType = null;
            dom.previewContainer.classList.add('hidden');
            dom.imagePreview.src = '';
            validateInput();
        }

        function renderMarkdown(text) {
            if (!text) return '';
            let html = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            html = html.replace(/^### (.*$)/gim, '<h3 class="text-lg font-bold mt-4 mb-2 text-white">$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2 class="text-xl font-bold mt-5 mb-2 text-white">$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1 class="text-2xl font-bold mt-6 mb-3 text-white">$1</h1>');
            html = html.replace(/^\s*-\s+(.*)/gm, '<ul><li>$1</li></ul>');
            html = html.replace(/^\s*\*\s+(.*)/gm, '<ul><li>$1</li></ul>');
            html = html.replace(/<\/ul>\n<ul>/g, '\n');
            
            return html.split(/\n\n+/).map(p => {
                if(p.startsWith('<pre') || p.startsWith('<ul') || p.startsWith('<h')) return p;
                return `<p>${p.replace(/\n/g, '<br>')}</p>`;
            }).join('');
        }

        function scrollToBottom() {
            dom.scrollAnchor.scrollIntoView({ behavior: 'smooth' });
        }

        function appendUserMessage(text, imgBase64) {
            if(dom.emptyState) dom.emptyState.style.display = 'none';

            const wrapper = document.createElement('div');
            wrapper.className = 'flex items-start justify-end gap-3 ml-12';
            
            let content = `<div class="bg-nexus-userBubble border border-nexus-border rounded-2xl rounded-tr-none p-4 text-sm max-w-2xl flex flex-col gap-3 shadow-md">`;
            
            if (imgBase64) {
                content += `<img src="${imgBase64}" class="max-w-[240px] rounded-lg border border-nexus-border object-contain bg-black" alt="User Upload">`;
            }
            if (text) {
                content += `<p class="text-white whitespace-pre-wrap leading-relaxed">${text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</p>`;
            }
            content += `</div>`;
            
            wrapper.innerHTML = content;
            dom.chatHistory.appendChild(wrapper);
            scrollToBottom();
        }

        function appendAiMessage(text, isError = false) {
            const wrapper = document.createElement('div');
            wrapper.className = 'flex items-start gap-4 mr-12';
            
            const textColor = isError ? 'text-red-400' : 'text-nexus-text';
            const iconColor = isError ? 'text-red-500' : 'text-white';
            const borderGlow = isError ? 'border-red-900' : 'border-nexus-border';
            
            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-nexus-panel border ${borderGlow} flex items-center justify-center flex-shrink-0 mt-1 shadow-sm">
                    <svg class="w-4 h-4 ${iconColor}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
                </div>
                <div class="flex-1 bg-nexus-aiBubble border ${borderGlow} rounded-2xl rounded-tl-none p-4 text-sm shadow-sm overflow-hidden">
                    <div class="markdown-content ${textColor}">
                        ${isError ? `<p class="font-mono text-xs"><strong>[SYSTEM_ERR]</strong> ${text}</p>` : renderMarkdown(text)}
                    </div>
                </div>
            `;
            
            dom.chatHistory.appendChild(wrapper);
            scrollToBottom();
        }

        async function processSubmission() {
            const text = dom.input.value.trim();
            const imgData = state.imageBase64;
            const mimeType = state.mimeType;
            
            if (!text && !imgData) return;

            // UI Updates before fetch
            appendUserMessage(text, imgData);
            
            state.conversation.push({
                role: 'user',
                text: text,
                imageBase64: imgData,
                mimeType: mimeType
            });

            dom.input.value = '';
            dom.input.style.height = 'auto';
            clearImageState();
            
            dom.loadingIndicator.classList.remove('hidden');
            dom.loadingIndicator.classList.add('flex');
            scrollToBottom();

            // Format payload for Gemini
            const contents = state.conversation.map(msg => {
                const parts = [];
                if (msg.text) {
                    parts.push({ text: msg.text });
                }
                if (msg.imageBase64 && msg.mimeType) {
                    const base64Raw = msg.imageBase64.split(',')[1];
                    parts.push({
                        inlineData: {
                            mimeType: msg.mimeType,
                            data: base64Raw
                        }
                    });
                }
                return { role: msg.role, parts: parts };
            });

            const payload = { contents: contents };
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${API_KEY}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error?.message || `HTTP Connection failed with status ${response.status}`);
                }

                dom.loadingIndicator.classList.add('hidden');
                dom.loadingIndicator.classList.remove('flex');

                if (result.candidates && result.candidates.length > 0) {
                    const aiText = result.candidates[0].content.parts[0].text;
                    appendAiMessage(aiText);
                    state.conversation.push({ role: 'model', text: aiText });
                } else {
                    throw new Error("Null output received from core routing.");
                }

            } catch (error) {
                console.error("Nexus Ai Core Error:", error);
                dom.loadingIndicator.classList.add('hidden');
                dom.loadingIndicator.classList.remove('flex');
                
                appendAiMessage(error.message, true);
                state.conversation.pop(); // Remove failed user context
            }
        }

        // Event Listener Attachment
        dom.submitBtn.addEventListener('click', processSubmission);

    </script>
</body>
</html>
