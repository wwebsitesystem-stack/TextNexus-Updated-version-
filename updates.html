<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Updates // TextNexus OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #000000;
            --bg-surface: #0a0a0a;
            --glass-panel: rgba(18, 18, 18, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --text-tertiary: #555555;
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            padding: 32px 28px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
        }

        .header-title h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .header-title p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .badge-live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 6px 12px;
            border-radius: 20px;
        }

        .dot-green {
            width: 6px; height: 6px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
        }

        /* Timeline structure */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .update-card {
            background: var(--glass-panel);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px 24px;
            backdrop-filter: blur(20px);
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .update-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .update-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .update-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .tag-feature { background: rgba(0, 150, 255, 0.15); color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.3); }
        .tag-security { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
        .tag-patch { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }

        .update-date {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .update-title {
            font-size: 16px;
            font-weight: 500;
            color: #fff;
            margin-bottom: 8px;
        }

        .update-description {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .version-pill {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
            margin-right: 8px;
        }

        /* Loading / Empty States */
        .state-container {
            text-align: center;
            padding: 60px 0;
            color: var(--text-tertiary);
            font-size: 13px;
            font-family: var(--font-mono);
        }

        .spinner {
            width: 24px; height: 24px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <h1>System Updates</h1>
            <p>Real-time patch notes and platform changelogs</p>
        </div>
        <div class="badge-live">
            <div class="dot-green"></div>
            <span>FIREBASE SYNC</span>
        </div>
    </div>

    <div id="timeline-container" class="timeline">
        <div class="state-container">
            <div class="spinner"></div>
            FETCHING SYSTEM UPDATES...
        </div>
    </div>

    <!-- FIREBASE DB INTEGRATION -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            projectId: "nexus-web-development-official",
            databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const container = document.getElementById('timeline-container');

        // Realtime Listener on /updates
        const updatesRef = ref(db, 'updates');
        onValue(updatesRef, (snapshot) => {
            const data = snapshot.val();
            
            if (!data) {
                // Fallback default content if DB node is currently empty
                renderFallbackUpdates();
                return;
            }

            container.innerHTML = '';
            
            // Convert Firebase Object/Map into array and render
            const updateList = Array.isArray(data) ? data : Object.values(data);
            
            // Sort by date descending if timestamps exist
            updateList.reverse().forEach(item => {
                const card = document.createElement('div');
                card.className = 'update-card';

                const categoryTag = getCategoryClass(item.type || item.category || 'feature');

                card.innerHTML = `
                    <div class="update-meta">
                        <div>
                            <span class="version-pill">${item.version || 'v6.0.0'}</span>
                            <span class="update-tag ${categoryTag}">${item.type || item.category || 'Feature'}</span>
                        </div>
                        <span class="update-date">${item.date || 'Recent'}</span>
                    </div>
                    <div class="update-title">${item.title || 'System Enhancement'}</div>
                    <div class="update-description">${item.description || item.details || ''}</div>
                `;
                container.appendChild(card);
            });
        }, (error) => {
            console.error(error);
            renderFallbackUpdates();
        });

        function getCategoryClass(cat) {
            const lower = cat.toLowerCase();
            if (lower.includes('sec')) return 'tag-security';
            if (lower.includes('fix') || lower.includes('patch')) return 'tag-patch';
            return 'tag-feature';
        }

        function renderFallbackUpdates() {
            container.innerHTML = `
                <div class="update-card">
                    <div class="update-meta">
                        <div>
                            <span class="version-pill">v6.0.0</span>
                            <span class="update-tag tag-feature">Major Release</span>
                        </div>
                        <span class="update-date">2026-09-24</span>
                    </div>
                    <div class="update-title">TextNexus OS 6.0 Premium Architecture</div>
                    <div class="update-description">Initialized dark glassmorphic interface, introduced multi-stage boot sequence, Raycast-inspired command palette (⌘K), and Firebase auth synchronization.</div>
                </div>
            `;
        }
    </script>
</body>
</html>
