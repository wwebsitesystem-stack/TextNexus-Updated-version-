<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OWNER CONTROL PANEL // TEXTNEXUS V5.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030812;
            --gold: #FFD700;
            --cyan: #00F5D4;
            --red: #FF2A6D;
            --font-head: 'Orbitron', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
        }

        body {
            background: var(--bg);
            color: var(--cyan);
            font-family: var(--font-mono);
            padding: 24px;
        }

        .panel-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(4, 15, 25, 0.9);
            border: 1px solid var(--gold);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
            padding: 24px;
            border-radius: 6px;
        }

        h1 {
            font-family: var(--font-head);
            color: var(--gold);
            font-size: 20px;
            letter-spacing: 3px;
            border-bottom: 1px dashed var(--gold);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .section-title {
            font-family: var(--font-head);
            font-size: 13px;
            letter-spacing: 2px;
            color: #FFF;
            margin-bottom: 12px;
        }

        .cmd-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn-cmd {
            background: rgba(0, 245, 212, 0.08);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            padding: 12px;
            font-family: var(--font-head);
            font-size: 11px;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
            text-align: center;
        }

        .btn-cmd:hover {
            background: var(--cyan);
            color: #000;
            box-shadow: 0 0 15px var(--cyan);
        }

        .btn-cmd.btn-vault {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(255, 215, 0, 0.1);
        }

        .btn-cmd.btn-vault:hover {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 20px var(--gold);
        }

        .btn-cmd.btn-danger {
            border-color: var(--red);
            color: var(--red);
            background: rgba(255, 42, 109, 0.1);
        }

        .btn-cmd.btn-danger:hover {
            background: var(--red);
            color: #FFF;
            box-shadow: 0 0 20px var(--red);
        }

        .cli-box {
            background: #000;
            border: 1px solid var(--gold);
            padding: 12px;
            border-radius: 4px;
        }

        .cli-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--gold);
            font-family: var(--font-mono);
            font-size: 13px;
            margin-top: 6px;
        }

        .log-out {
            height: 100px;
            overflow-y: auto;
            font-size: 11px;
            color: rgba(255, 215, 0, 0.8);
            border-bottom: 1px dashed rgba(255, 215, 0, 0.3);
            padding-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="panel-container">
        <h1>👑 OWNER COMMAND &amp; OVERRIDE PANEL</h1>

        <div class="section-title">THE VAULT DIRECT CONTROLS</div>
        <div class="cmd-grid">
            <button class="btn-cmd btn-vault" id="btn-open-vault">
                🔓 OVERRIDE &amp; OPEN VAULT
            </button>
            <button class="btn-cmd" id="btn-lock-vault">
                🔒 RE-LOCK VAULT
            </button>
            <button class="btn-cmd btn-danger" id="btn-lockdown">
                ⚠️ TRIGGER COMPLETE_LOCKDOWN
            </button>
        </div>

        <div class="section-title">SYSTEM MAINTENANCE &amp; UTILITIES</div>
        <div class="cmd-grid">
            <button class="btn-cmd" id="btn-maint-on">MAINTENANCE ON</button>
            <button class="btn-cmd" id="btn-maint-off">MAINTENANCE OFF</button>
            <button class="btn-cmd" id="btn-refresh">GLOBAL REFRESH</button>
        </div>

        <div class="section-title">OWNER DIRECT CLI ENGINE</div>
        <div class="cli-box">
            <div class="log-out" id="cli-logs">
                > Owner Terminal Online. Type 'open_vault' to unlock vault directly.
            </div>
            <div style="display: flex; gap: 8px; align-items: center; margin-top: 6px;">
                <span style="color: var(--gold); font-weight: bold;">OWNER#&gt;</span>
                <input type="text" class="cli-input" id="cli-in" placeholder="open_vault, lock_vault, unlock..." autocomplete="off">
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getDatabase, ref, update } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com",
            projectId: "nexus-web-development-official"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const logs = document.getElementById('cli-logs');
        const cliInput = document.getElementById('cli-in');

        function printLog(msg) {
            const div = document.createElement('div');
            div.textContent = `> ${msg}`;
            logs.appendChild(div);
            logs.scrollTop = logs.scrollHeight;
        }

        // FIREBASE SYSTEM COMMAND PUSHERS
        async function openVault() {
            await update(ref(db, 'system'), {
                command: 'OPEN_VAULT',
                vaultState: 'OVERRIDE_UNLOCKED'
            });
            printLog("SUCCESS: Sent OPEN_VAULT command! Vault is now unlocked.");
        }

        async function lockVault() {
            await update(ref(db, 'system'), {
                command: 'online',
                vaultState: 'LOCKED'
            });
            printLog("SUCCESS: Sent RE-LOCK command! Vault is now secure.");
        }

        async function triggerLockdown() {
            await update(ref(db, 'system'), {
                command: 'COMPLETE_LOCKDOWN',
                status: 'LOCKDOWN'
            });
            printLog("WARNING: COMPLETE_LOCKDOWN triggered site-wide!");
        }

        // BUTTON EVENT LISTENERS
        document.getElementById('btn-open-vault').addEventListener('click', openVault);
        document.getElementById('btn-lock-vault').addEventListener('click', lockVault);
        document.getElementById('btn-lockdown').addEventListener('click', triggerLockdown);

        document.getElementById('btn-maint-on').addEventListener('click', async () => {
            await update(ref(db, 'system'), { command: 'maintenance', status: 'MAINTENANCE' });
            printLog("Maintenance mode ON.");
        });

        document.getElementById('btn-maint-off').addEventListener('click', async () => {
            await update(ref(db, 'system'), { command: 'online', status: 'STABLE' });
            printLog("Maintenance mode OFF.");
        });

        document.getElementById('btn-refresh').addEventListener('click', async () => {
            await update(ref(db, 'system'), { refreshTrigger: Date.now() });
            printLog("Global Refresh Sent.");
        });

        // CLI ENGINE PROCESSOR
        cliInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const cmd = cliInput.value.trim().toLowerCase();
                cliInput.value = '';
                printLog(`OWNER#> ${cmd}`);

                if (cmd === 'open_vault' || cmd === 'vault_open' || cmd === 'unlock_vault') {
                    await openVault();
                } else if (cmd === 'lock_vault' || cmd === 'vault_lock') {
                    await lockVault();
                } else if (cmd === 'lockdown') {
                    await triggerLockdown();
                } else if (cmd === 'clear') {
                    logs.innerHTML = '';
                } else {
                    printLog("Unknown command. Available: open_vault, lock_vault, lockdown, clear");
                }
            }
        });
    </script>
</body>
</html>
