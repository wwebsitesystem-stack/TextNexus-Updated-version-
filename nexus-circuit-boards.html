<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Circuit Boards</title>
  <style>
    :root {
      --bg-dark: #05070a;
      --sidebar-bg: #090d14;
      --card-bg: rgba(13, 19, 31, 0.8);
      --accent-cyan: #00f2fe;
      --accent-green: #00ffaa;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #e2e8f0;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Layout */
    aside {
      width: 260px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2rem;
    }

    .brand-logo {
      width: 14px;
      height: 14px;
      background: var(--accent-cyan);
      transform: rotate(45deg);
      box-shadow: 0 0 10px var(--accent-cyan);
    }

    .brand-name {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .version-tag {
      font-size: 0.65rem;
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .nav-item {
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .nav-item.active {
      background: rgba(0, 242, 254, 0.1);
      color: #fff;
      border: 1px solid rgba(0, 242, 254, 0.3);
    }

    .user-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.75rem;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 0.5rem;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #1e293b;
      border: 1px solid var(--accent-cyan);
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-name {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .user-role {
      font-size: 0.65rem;
      color: #f59e0b;
    }

    .btn-disconnect {
      width: 100%;
      padding: 0.5rem;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.7rem;
      letter-spacing: 1px;
      cursor: pointer;
    }

    /* Main Content Area */
    main {
      flex: 1;
      padding: 2.5rem;
      overflow-y: auto;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      color: var(--accent-green);
      background: rgba(0, 255, 170, 0.1);
      border: 1px solid rgba(0, 255, 170, 0.3);
      padding: 4px 10px;
      border-radius: 4px;
      font-family: monospace;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 2rem;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 2rem;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    input, textarea {
      width: 100%;
      background: #090d14;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.6rem;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--accent-cyan);
    }

    .btn-submit {
      width: 100%;
      padding: 0.7rem;
      background: var(--accent-cyan);
      border: none;
      border-radius: 6px;
      color: #05070a;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    /* Cards Grid */
    .boards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.2rem;
    }

    .card {
      background: rgba(9, 13, 20, 0.9);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      background: #000;
    }

    .card-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .card-name {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .card-price {
      color: var(--accent-green);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .card-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      flex: 1;
    }

    .btn-buy {
      display: block;
      text-align: center;
      background: transparent;
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      text-decoration: none;
      padding: 0.4rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .btn-buy:hover {
      background: var(--accent-cyan);
      color: #05070a;
    }
  </style>
</head>
<body>

  <aside>
    <div>
      <div class="brand">
        <div class="brand-logo"></div>
        <span class="brand-name">NEXUS</span>
        <span class="version-tag">V3.4.5</span>
      </div>
      <ul class="nav-list">
        <li class="nav-item">⚡ HOME</li>
        <li class="nav-item">📡 UPDATES</li>
        <li class="nav-item">🔥 SHOUTOUTS</li>
        <li class="nav-item">👻 GHOSTLINK</li>
        <li class="nav-item active">💻 NEXUS CIRCUIT BOARDS</li>
        <li class="nav-item">📖 BIBLE VERSE OF THE DAY</li>
        <li class="nav-item">📱 TEXTNEXUS</li>
        <li class="nav-item">👑 OWNER</li>
        <li class="nav-item">⚙️ MORE ▾</li>
      </ul>
    </div>

    <div>
      <div class="user-card">
        <div class="avatar"></div>
        <div class="user-info">
          <span class="user-name">BRODY WILLIAMS</span>
          <span class="user-role">OPERATOR</span>
        </div>
      </div>
      <button class="btn-disconnect">DISCONNECT</button>
    </div>
  </aside>

  <main>
    <div class="badge">• VERSION V3.2</div>
    <h1>Nexus Circuit Boards</h1>

    <div class="content-grid">
      <div class="panel">
        <div class="panel-title">// UPLOAD CIRCUIT</div>
        <form id="circuitForm">
          <div class="form-group">
            <label>Board Title</label>
            <input type="text" id="title" placeholder="Nexus Pro Chip" required>
          </div>
          <div class="form-group">
            <label>Price ($)</label>
            <input type="number" step="0.01" id="price" placeholder="29.99" required>
          </div>
          <div class="form-group">
            <label>Image URL</label>
            <input type="url" id="imageUrl" placeholder="https://..." required>
          </div>
          <div class="form-group">
            <label>Payment / Checkout URL</label>
            <input type="url" id="paymentUrl" placeholder="https://..." required>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="description" rows="3" placeholder="Enter board specs..."></textarea>
          </div>
          <button type="submit" class="btn-submit">PUBLISH NODE</button>
        </form>
      </div>

      <div class="panel">
        <div class="panel-title">// LIVE INVENTORY FEED</div>
        <div id="boardsGrid" class="boards-grid">
          <p style="color: var(--text-muted); font-size: 0.8rem;">Connecting to network...</p>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
      authDomain: "nexus-web-development-official.firebaseapp.com",
      databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com",
      projectId: "nexus-web-development-official",
      storageBucket: "nexus-web-development-official.firebasestorage.app",
      messagingSenderId: "553556577139",
      appId: "1:553556577139:web:ea4469b06c2c01cc999306",
      measurementId: "G-S6K1M5PZLE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const form = document.getElementById('circuitForm');
    const boardsGrid = document.getElementById('boardsGrid');

    // Save Data to Realtime Database
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const circuitData = {
        title: document.getElementById('title').value,
        price: document.getElementById('price').value,
        imageUrl: document.getElementById('imageUrl').value,
        paymentUrl: document.getElementById('paymentUrl').value,
        description: document.getElementById('description').value,
        timestamp: Date.now()
      };

      push(ref(db, 'circuits'), circuitData)
        .then(() => form.reset())
        .catch((err) => console.error("Upload error:", err));
    });

    // Real-time Database Listener
    onValue(ref(db, 'circuits'), (snapshot) => {
      boardsGrid.innerHTML = '';
      const data = snapshot.val();

      if (!data) {
        boardsGrid.innerHTML = '<p style="color: var(--text-muted); font-size: 0.8rem;">No circuit boards published yet.</p>';
        return;
      }

      Object.keys(data).forEach((key) => {
        const board = data[key];
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${board.imageUrl}" class="card-img" alt="${board.title}" onerror="this.src='https://via.placeholder.com/300x140?text=No+Preview'">
          <div class="card-body">
            <div class="card-header">
              <span class="card-name">${board.title}</span>
              <span class="card-price">$${parseFloat(board.price).toFixed(2)}</span>
            </div>
            <p class="card-desc">${board.description || 'No specs provided.'}</p>
            <a href="${board.paymentUrl}" target="_blank" rel="noopener" class="btn-buy">BUY NOW</a>
          </div>
        `;
        boardsGrid.appendChild(card);
      });
    });
  </script>
</body>
</html>
