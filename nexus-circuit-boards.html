<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Circuit Boards</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; min-height: 100vh; }

    .container { max-width: 1100px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.5rem;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--card-border);
    }

    .brand { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    .brand span { color: var(--accent); }

    .btn {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn:hover { background: var(--accent-hover); color: #fff; }
    .btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--card-border); }
    .btn-secondary:hover { background: var(--card-border); color: var(--text); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); padding: 0.4rem 0.8rem; border-radius: 6px; }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    /* Layout Grid */
    .shop-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 850px) {
      .shop-layout { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .panel-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 1.25rem; }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; font-weight: 500; }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.65rem 0.8rem;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }

    /* Product Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); }

    .card-img { width: 100%; height: 180px; object-fit: cover; background: #000; }
    .card-body { padding: 1.2rem; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.25rem; }
    .card-price { font-size: 1rem; font-weight: 700; color: var(--accent); margin-bottom: 0.75rem; }
    .card-desc { color: var(--muted); font-size: 0.85rem; line-height: 1.4; margin-bottom: 1.25rem; flex-grow: 1; }
    .card-actions { display: flex; gap: 0.5rem; align-items: center; }

    .status { margin-top: 1rem; font-size: 0.85rem; color: var(--accent); text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">Nexus <span>Circuit Boards</span></div>
    </header>

    <div class="shop-layout">
      <div class="panel">
        <h2 class="panel-title">Add New Board</h2>
        <form id="boardForm">
          <div class="form-group">
            <label>Board Name</label>
            <input type="text" id="bName" placeholder="e.g. Nexus Core V1" required>
          </div>
          <div class="form-group">
            <label>Price ($ USD)</label>
            <input type="number" step="0.01" id="bPrice" placeholder="24.99" required>
          </div>
          <div class="form-group">
            <label>Payment URL</label>
            <input type="url" id="bPayUrl" placeholder="https://buy.stripe.com/..." required>
          </div>
          <div class="form-group">
            <label>Board Image</label>
            <input type="file" id="bImage" accept="image/*" required>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="bDesc" rows="3" placeholder="Key specs or details..."></textarea>
          </div>
          <button type="submit" class="btn" id="submitBtn" style="width: 100%;">Publish Board</button>
          <div id="statusMsg" class="status"></div>
        </form>
      </div>

      <main class="grid" id="productGrid"></main>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
      authDomain: "nexus-web-development-official.firebaseapp.com",
      databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com",
      projectId: "nexus-web-development-official",
      storageBucket: "nexus-web-development-official.firebasestorage.app",
      messagingSenderId: "553556577139",
      appId: "1:553556577139:web:ea4469b06c2c01cc999306",
      measurementId: "G-S6K1M5PZLE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);

    const productGrid = document.getElementById('productGrid');
    const boardForm = document.getElementById('boardForm');
    const statusMsg = document.getElementById('statusMsg');
    const submitBtn = document.getElementById('submitBtn');

    // Realtime Database Sync
    const boardsRef = ref(db, 'circuit_boards');
    onValue(boardsRef, (snapshot) => {
      productGrid.innerHTML = '';
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach((id) => {
          renderCard(id, data[id]);
        });
      } else {
        productGrid.innerHTML = `<p style="color: var(--muted); grid-column: 1/-1;">No boards listed yet.</p>`;
      }
    });

    // Form Submit
    boardForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = document.getElementById('bImage').files[0];
      if (!file) return;

      try {
        submitBtn.disabled = true;
        statusMsg.innerText = "Uploading image...";

        const imagePath = `boards/${Date.now()}_${file.name}`;
        const sRef = storageRef(storage, imagePath);
        await uploadBytes(sRef, file);
        const imageUrl = await getDownloadURL(sRef);

        statusMsg.innerText = "Saving to database...";

        await push(boardsRef, {
          name: document.getElementById('bName').value,
          price: parseFloat(document.getElementById('bPrice').value).toFixed(2),
          payUrl: document.getElementById('bPayUrl').value,
          description: document.getElementById('bDesc').value,
          imageUrl: imageUrl,
          timestamp: Date.now()
        });

        statusMsg.innerText = "";
        submitBtn.disabled = false;
        boardForm.reset();
      } catch (err) {
        console.error(err);
        statusMsg.innerText = "Upload failed.";
        submitBtn.disabled = false;
      }
    });

    // Render Cards
    function renderCard(id, board) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img class="card-img" src="${board.imageUrl}" alt="${board.name}">
        <div class="card-body">
          <h3 class="card-title">${board.name}</h3>
          <div class="card-price">$${board.price}</div>
          <p class="card-desc">${board.description || 'No description provided.'}</p>
          <div class="card-actions">
            <a href="${board.payUrl}" target="_blank" class="btn" style="flex-grow: 1;">Buy Now</a>
            <button class="btn-danger" onclick="deleteBoard('${id}')">Delete</button>
          </div>
        </div>
      `;
      productGrid.appendChild(card);
    }

    // Delete Board
    window.deleteBoard = (id) => {
      if (confirm("Remove this board from Firebase?")) {
        remove(ref(db, `circuit_boards/${id}`));
      }
    };
  </script>
</body>
</html>
