<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Circuit Board | Store & Portal</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(18, 26, 43, 0.7);
      --accent-neon: #00ffcc;
      --accent-blue: #00bfff;
      --text-main: #e2e8f0;
      --text-dim: #94a3b8;
      --border-glow: rgba(0, 255, 204, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 255, 204, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(0, 191, 255, 0.05) 0%, transparent 40%);
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
      border-bottom: 1px solid var(--border-glow);
      padding-bottom: 1.5rem;
    }

    header h1 {
      font-size: 2.8rem;
      letter-spacing: 2px;
      color: var(--accent-neon);
      text-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
    }

    header p {
      color: var(--text-dim);
      font-size: 1.1rem;
      margin-top: 0.5rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 2rem;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border-glow);
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .panel h2 {
      font-size: 1.4rem;
      margin-bottom: 1.2rem;
      color: var(--accent-blue);
      border-left: 4px solid var(--accent-neon);
      padding-left: 0.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input, textarea {
      width: 100%;
      padding: 0.75rem;
      background: rgba(10, 15, 25, 0.8);
      border: 1px solid rgba(0, 255, 204, 0.2);
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s ease;
    }

    input:focus, textarea:focus {
      border-color: var(--accent-neon);
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
    }

    button {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, var(--accent-neon), var(--accent-blue));
      border: none;
      border-radius: 6px;
      color: #0b0f19;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: opacity 0.3s ease, transform 0.1s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.99);
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: rgba(10, 15, 25, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-neon);
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #000;
    }

    .card-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.1rem;
      color: #fff;
      margin-bottom: 0.3rem;
    }

    .card-price {
      color: var(--accent-neon);
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 1rem;
      flex-grow: 1;
    }

    .buy-btn {
      display: block;
      text-align: center;
      background: transparent;
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      text-decoration: none;
      padding: 0.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .buy-btn:hover {
      background: var(--accent-blue);
      color: #0b0f19;
    }
  </style>
</head>
<body>

  <header>
    <h1>NEXUS CIRCUIT BOARD</h1>
    <p>Hardware Architecture & Inventory Portal</p>
  </header>

  <div class="container">
    <div class="panel">
      <h2>Upload Circuit Board</h2>
      <form id="uploadForm">
        <div class="form-group">
          <label for="title">Board Name</label>
          <input type="text" id="title" required placeholder="e.g., Nexus V1 Proto">
        </div>
        <div class="form-group">
          <label for="price">Price ($)</label>
          <input type="number" step="0.01" id="price" required placeholder="49.99">
        </div>
        <div class="form-group">
          <label for="imageUrl">Image URL</label>
          <input type="url" id="imageUrl" required placeholder="https://example.com/board.jpg">
        </div>
        <div class="form-group">
          <label for="paymentUrl">Payment / Checkout Link</label>
          <input type="url" id="paymentUrl" required placeholder="https://stripe.com/pay/...">
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="3" placeholder="Specs, chipset details..."></textarea>
        </div>
        <button type="submit">Deploy Node</button>
      </form>
    </div>

    <div class="panel">
      <h2>Active Circuit Inventory</h2>
      <div id="boardGrid" class="board-grid">
        <p style="color: var(--text-dim);">Loading inventory dynamic feed...</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
      authDomain: "nexus-web-development-official.firebaseapp.com",
      databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com",
      projectId: "nexus-web-development-official",
      storageBucket: "nexus-web-development-official.firebasestorage.app",
      messagingSenderId: "553556577139",
      appId: "1:553556577139:web:ea4469b06c2c01cc999306",
      measurementId: "G-S6K1M5PZLE"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);

    const form = document.getElementById('uploadForm');
    const boardGrid = document.getElementById('boardGrid');

    // Save Data to Firebase Realtime Database
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const newBoard = {
        title: document.getElementById('title').value,
        price: document.getElementById('price').value,
        imageUrl: document.getElementById('imageUrl').value,
        paymentUrl: document.getElementById('paymentUrl').value,
        description: document.getElementById('description').value,
        timestamp: Date.now()
      };

      const boardsRef = ref(db, 'circuits');
      push(boardsRef, newBoard)
        .then(() => {
          form.reset();
        })
        .catch((error) => {
          console.error("Error publishing board: ", error);
        });
    });

    // Real-time Listener to Render Boards
    const boardsRef = ref(db, 'circuits');
    onValue(boardsRef, (snapshot) => {
      boardGrid.innerHTML = '';
      const data = snapshot.val();
      
      if (!data) {
        boardGrid.innerHTML = '<p style="color: var(--text-dim);">No circuit boards uploaded yet.</p>';
        return;
      }

      Object.keys(data).forEach((key) => {
        const item = data[key];
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.imageUrl}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x160?text=Image+Unavailable'">
          <div class="card-body">
            <div class="card-title">${item.title}</div>
            <div class="card-price">$${parseFloat(item.price).toFixed(2)}</div>
            <div class="card-desc">${item.description || 'No description provided.'}</div>
            <a href="${item.paymentUrl}" target="_blank" rel="noopener" class="buy-btn">Acquire Board</a>
          </div>
        `;
        boardGrid.appendChild(card);
      });
    });
  </script>
</body>
</html>
