<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Circuit Boards</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 40px 20px; }
    
    header { text-align: center; margin-bottom: 40px; }
    h1 { color: #38bdf8; font-size: 2.5rem; margin-bottom: 8px; }
    p.subtitle { color: #94a3b8; font-size: 1rem; }
    
    .container { max-width: 1200px; margin: 0 auto; }
    
    /* Product Grid */
    .boards-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
      gap: 25px; 
    }
    
    /* Board Card Styling */
    .card { 
      background: #1e293b; 
      border-radius: 12px; 
      overflow: hidden; 
      border: 1px solid #334155; 
      display: flex; 
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }
    .card img { 
      width: 100%; 
      height: 180px; 
      object-fit: cover; 
      background-color: #0f172a; 
    }
    .card-body { 
      padding: 20px; 
      flex-grow: 1; 
      display: flex; 
      flex-direction: column; 
    }
    .card-title { 
      font-size: 1.25rem; 
      font-weight: 600; 
      margin-bottom: 8px; 
      color: #f8fafc;
    }
    .card-desc { 
      font-size: 0.9rem; 
      color: #94a3b8; 
      margin-bottom: 20px; 
      line-height: 1.4;
      flex-grow: 1; 
    }
    .card-footer { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-top: auto; 
    }
    .price { 
      font-size: 1.3rem; 
      font-weight: 700; 
      color: #4ade80; 
    }
    .buy-btn { 
      background: #0284c7; 
      color: #ffffff; 
      text-decoration: none; 
      padding: 10px 16px; 
      border-radius: 6px; 
      font-weight: 600; 
      font-size: 0.9rem; 
      transition: background 0.2s;
    }
    .buy-btn:hover { 
      background: #0369a1; 
    }
    
    .status-msg {
      text-align: center;
      color: #94a3b8;
      font-size: 1.1rem;
      grid-column: 1 / -1;
      padding: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Nexus Circuit Boards</h1>
    <p class="subtitle">Available components and custom schematics</p>
  </header>

  <div class="container">
    <div class="boards-grid" id="boardsGrid">
      <div class="status-msg">Connecting to database...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
      authDomain: "nexus-web-development-official.firebaseapp.com",
      databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com",
      projectId: "nexus-web-development-official",
      storageBucket: "nexus-web-development-official.firebasestorage.app",
      messagingSenderId: "553556577139",
      appId: "1:553556577139:web:ea4469b06c2c01cc999306",
      measurementId: "G-S6K1M5PZLE"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const boardsRef = ref(database, 'boards');

    const boardsGrid = document.getElementById('boardsGrid');

    // Listens for updates in your database under the "boards" node
    onValue(boardsRef, (snapshot) => {
      boardsGrid.innerHTML = '';
      const data = snapshot.val();

      if (!data) {
        boardsGrid.innerHTML = '<div class="status-msg">No circuit boards found in database.</div>';
        return;
      }

      // Loop through each entry in 'boards'
      Object.keys(data).forEach((key) => {
        const board = data[key];

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${board.image || 'https://via.placeholder.com/300x180?text=No+Image'}" alt="${board.name || 'Board Image'}">
          <div class="card-body">
            <h2 class="card-title">${board.name || 'Unnamed Board'}</h2>
            <p class="card-desc">${board.description || 'No description available.'}</p>
            <div class="card-footer">
              <span class="price">$${board.price || '0.00'}</span>
              <a href="${board.paymentUrl || '#'}" target="_blank" class="buy-btn">Buy Now</a>
            </div>
          </div>
        `;
        boardsGrid.appendChild(card);
      });
    });
  </script>
</body>
</html>
