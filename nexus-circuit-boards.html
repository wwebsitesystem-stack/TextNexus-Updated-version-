<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Hardware Store</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-border: #1f293d;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; }

    .header {
      max-width: 1200px;
      margin: 0 auto 3rem auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1.5rem;
    }

    .brand { font-size: 1.8rem; font-weight: 800; tracking: -0.05em; }
    .brand span { color: var(--accent); text-shadow: 0 0 12px var(--accent-glow); }

    .btn {
      background: var(--accent);
      color: #090d16;
      font-weight: 700;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 20px var(--accent-glow); }
    .btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--card-border); }
    .btn-secondary:hover { background: var(--card-border); color: var(--text); }

    .grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s ease;
    }
    .card:hover { border-color: var(--accent); }
    .card-img { width: 100%; height: 220px; object-fit: cover; background: #000; }
    .card-content { padding: 1.5rem; display: flex; flex-direction: column; flex-grow: 1; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem; }
    .card-title { font-size: 1.25rem; font-weight: 700; }
    .card-price { font-size: 1.25rem; font-weight: 800; color: var(--accent); }
    .card-desc { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; flex-grow: 1; }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      padding: 2rem;
    }
    .modal-title { font-size: 1.5rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.4rem; font-weight: 600; }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text);
      outline: none;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 2rem; }
    .status-msg { margin-top: 1rem; font-size: 0.9rem; color: var(--accent); }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand">NEXUS <span>BOARDS</span></div>
    <button class="btn" onclick="toggleModal(true)">+ List New Board</button>
  </header>

  <main class="grid" id="productGrid"></main>

  <div class="modal" id="productModal">
    <div class="modal-box">
      <h2 class="modal-title">Add Circuit Board</h2>
      <form id="boardForm">
        <div class="form-group">
          <label>BOARD NAME</label>
          <input type="text" id="bName" placeholder="e.g. Nexus Core V1" required>
        </div>
        <div class="form-group">
          <label>PRICE ($ USD)</label>
          <input type="number" step="0.01" id="bPrice" placeholder="49.99" required>
        </div>
        <div class="form-group">
          <label>PAYMENT URL (Stripe / PayPal / Cash App)</label>
          <input type="url" id="bPayUrl" placeholder="https://buy.stripe.com/..." required>
        </div>
        <div class="form-group">
          <label>BOARD IMAGE</label>
          <input type="file" id="bImage" accept="image/*" required>
        </div>
        <div class="form-group">
          <label>SPECIFICATIONS / DESCRIPTION</label>
          <textarea id="bDesc" rows="3" placeholder="Dual MCU, built-in Wi-Fi, 5V power rails..."></textarea>
        </div>
        <div id="statusMsg" class="status-msg"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="toggleModal(false)">Cancel</button>
          <button type="submit" class="btn" id="submitBtn">Publish Board</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    // Firebase Imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
      authDomain: "nexus-web-development-official.firebaseapp.com",
      databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com",
      projectId: "nexus-web-development-official",
      storageBucket: "nexus-web-development-official.firebasestorage.app",
      messagingSenderId: "553556577139",
      appId: "1:553556577139:web:ea4469b06c2c01cc999306",
      measurementId: "G-S6K1M5PZLE"
    };

    // Initialize Firebase Services
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);

    const productGrid = document.getElementById('productGrid');
    const boardForm = document.getElementById('boardForm');
    const statusMsg = document.getElementById('statusMsg');
    const submitBtn = document.getElementById('submitBtn');

    // Live Sync with Realtime Database
    const boardsRef = ref(db, 'circuit_boards');
    onValue(boardsRef, (snapshot) => {
      productGrid.innerHTML = '';
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach((key) => {
          renderCard(data[key]);
        });
      } else {
        productGrid.innerHTML = `<p style="color: var(--muted)">No circuit boards listed yet.</p>`;
      }
    });

    // Form Submission & Image Upload to Firebase Storage
    boardForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const file = document.getElementById('bImage').files[0];
      if (!file) return;

      try {
        submitBtn.disabled = true;
        statusMsg.innerText = "Uploading image...";

        // Upload Image
        const imagePath = `boards/${Date.now()}_${file.name}`;
        const sRef = storageRef(storage, imagePath);
        await uploadBytes(sRef, file);
        const imageUrl = await getDownloadURL(sRef);

        statusMsg.innerText = "Saving to Database...";

        // Save Board Entry to Realtime Database
        await push(boardsRef, {
          name: document.getElementById('bName').value,
          price: parseFloat(document.getElementById('bPrice').value).toFixed(2),
          payUrl: document.getElementById('bPayUrl').value,
          description: document.getElementById('bDesc').value,
          imageUrl: imageUrl,
          timestamp: Date.now()
        });

        statusMsg.innerText = "";
        submitBtn.disabled = false;
        boardForm.reset();
        toggleModal(false);
      } catch (err) {
        console.error(err);
        statusMsg.innerText = "Error uploading board. Check console.";
        submitBtn.disabled = false;
      }
    });

    // DOM Render Function
    function renderCard(board) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img class="card-img" src="${board.imageUrl}" alt="${board.name}">
        <div class="card-content">
          <div class="card-header">
            <h3 class="card-title">${board.name}</h3>
            <div class="card-price">$${board.price}</div>
          </div>
          <p class="card-desc">${board.description}</p>
          <a href="${board.payUrl}" target="_blank" class="btn" style="justify-content: center;">Buy Board</a>
        </div>
      `;
      productGrid.appendChild(card);
    }

    // Modal Global Control
    window.toggleModal = (show) => {
      document.getElementById('productModal').style.display = show ? 'flex' : 'none';
    };
  </script>
</body>
</html>
