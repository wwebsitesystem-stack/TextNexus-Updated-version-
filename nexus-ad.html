<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Announcement Ad</title>
    <style>
        /* Base page styling just to center the banner for viewing */
        body {
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6; /* Light gray background to make the dark banner pop */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container styling for the ad banner */
        .nexus-ad-banner {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            padding: 40px 20px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
            max-width: 650px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Main headline styling */
        .welcome-text {
            font-size: 2.8rem;
            margin: 0 0 15px 0;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Announcement paragraph styling */
        .announcement-text {
            font-size: 1.2rem;
            line-height: 1.6;
            margin: 0 0 30px 0;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #4facfe;
        }

        /* Highlight badge for the update */
        .highlight {
            color: #00f2fe;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 8px;
        }

        /* Call-to-action button */
        .cta-button {
            display: inline-block;
            background-color: #4facfe;
            color: #ffffff;
            padding: 14px 32px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            border-radius: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        .cta-button:hover {
            background-color: #00f2fe;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
        }
    </style>
</head>
<body>

    <div class="nexus-ad-banner">
        <div class="ad-content">
            <h1 class="welcome-text">Welcome to Nexus</h1>
            <p class="announcement-text">
                <span class="highlight">Important Update</span>
                We are changing the name of Nexus and our URL on <br>
                <strong>October 1st at 8:30 AM</strong>.
            </p>
            <a href="#" class="cta-button">Stay Tuned</a>
        </div>
    </div>

</body>
</html>
