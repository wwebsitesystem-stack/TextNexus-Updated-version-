<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextNexus // Communication Platform</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #07050a;
            --bg-surface: #0f0a17;
            --glass-panel: rgba(23, 15, 38, 0.7);
            --glass-border: rgba(168, 85, 247, 0.25);
            --glass-hover: rgba(168, 85, 247, 0.15);
            
            --text-primary: #ffffff;
            --text-secondary: #adabb8;
            --text-tertiary: #6e677a;
            
            --purple-primary: #a855f7;
            --purple-light: #c084fc;
            --purple-dark: #7e22ce;
            --purple-glow: rgba(168, 85, 247, 0.4);

            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            user-select: none; -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        .platform-container {
            display: flex;
            width: 100%;
            height: 100%;
            background: var(--bg-surface);
        }

        .rooms-sidebar {
            width: 280px;
            background: rgba(12, 8, 20, 0.95);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--glass-border);
        }

        .sidebar-title {
            font-size: 11px;
            font-family: var(--font-mono);
            letter-spacing: 1.5px;
            color: var(--purple-light);
            text-transform: uppercase;
        }

        .action-btn {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s var(--ease-out);
        }

        .action-btn:hover {
            background: var(--purple-primary);
            color: #fff;
            box-shadow: 0 0 12px var(--purple-glow);
        }

        .action-btn.danger:hover {
            background: #ff4444;
            color: #ffffff;
            border-color: #ff4444;
        }

        .code-join-box {
            display: flex;
            gap: 8px;
        }

        .code-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 8px;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 12px;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
        }

        .code-input:focus {
            border-color: var(--purple-primary);
        }

        .room-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .room-card {
            padding: 12px;
            border-radius: 10px;
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-card:hover {
            background: var(--glass-hover);
        }

        .room-card.active {
            background: rgba(168, 85, 247, 0.18);
            border-color: var(--purple-primary);
        }

        .room-card.global-card {
            border: 1px dashed var(--purple-primary);
        }

        .room-info h4 {
            font-size: 13px;
            font-weight: 500;
        }

        .room-info span {
            font-size: 10px;
            font-family: var(--font-mono);
            color: var(--text-secondary);
        }

        .room-badge {
            font-family: var(--font-mono);
            font-size: 10px;
            background: rgba(168, 85, 247, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--purple-light);
        }

        .chat-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #050308;
        }

        .chat-header {
            height: 56px;
            padding: 0 24px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-panel);
        }

        .chat-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-title h3 {
            font-size: 14px;
            font-weight: 500;
        }

        .code-tag {
            font-family: var(--font-mono);
            font-size: 11px;
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid var(--glass-border);
            padding: 2px 8px;
            border-radius: 12px;
            color: var(--purple-light);
        }

        .messages-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg-row {
            display: flex;
            flex-direction: column;
            max-width: 65%;
            animation: fadeIn 0.2s var(--ease-out);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .msg-row.me {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg-row.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-meta {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-tertiary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ROLE BADGES */
        .role-badge {
            font-family: var(--font-mono);
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: 700;
            background: rgba(168, 85, 247, 0.2);
            color: var(--purple-light);
            border: 1px solid rgba(168, 85, 247, 0.4);
        }

        .role-badge.owner {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.2);
        }

        .role-badge.admin {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.5);
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.4;
            user-select: text;
        }

        .msg-row.me .msg-bubble {
            background: linear-gradient(135deg, var(--purple-primary), var(--purple-dark));
            color: #ffffff;
            border-bottom-right-radius: 2px;
            box-shadow: 0 2px 10px rgba(168, 85, 247, 0.25);
        }

        .msg-row.other .msg-bubble {
            background: var(--glass-panel);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            border-bottom-left-radius: 2px;
        }

        .input-panel {
            padding: 16px 24px;
            border-top: 1px solid var(--glass-border);
            background: var(--glass-panel);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .msg-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px 16px;
            color: #fff;
            font-family: var(--font-sans);
            font-size: 13px;
            outline: none;
        }

        .msg-input:focus {
            border-color: var(--purple-primary);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--purple-primary), var(--purple-dark));
            color: #fff;
            border: 1px solid var(--purple-light);
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
        }

        .send-btn:hover {
            box-shadow: 0 0 18px rgba(168, 85, 247, 0.5);
        }
    </style>
</head>
<body>

    <div class="platform-container">
        <!-- SIDEBAR -->
        <div class="rooms-sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Channels</span>
                <button class="action-btn" onclick="createNewGroup()">+ New</button>
            </div>

            <div class="code-join-box">
                <input type="text" id="join-code-input" class="code-input" placeholder="6-DIGIT CODE" maxlength="6">
                <button class="action-btn" onclick="joinGroupByCode()">Join</button>
            </div>

            <div class="room-list" id="room-list-container"></div>
        </div>

        <!-- CHAT VIEWPORT -->
        <div class="chat-viewport">
            <div class="chat-header">
                <div class="chat-title">
                    <h3 id="current-room-name">Global Chat</h3>
                    <span id="current-room-code" class="code-tag">#GLOBAL</span>
                </div>
                
                <div style="display:flex; gap:10px; align-items:center;">
                    <button id="leave-room-btn" class="action-btn danger" onclick="leaveActiveRoom()" style="display: none;">Leave</button>
                    <button id="delete-room-btn" class="action-btn danger" onclick="deleteActiveRoom()" style="display: none;">Delete</button>
                    <div class="sidebar-title" id="user-role-display">ROLE // MEMBER</div>
                </div>
            </div>

            <div class="messages-area" id="messages-area">
                <div style="text-align: center; color: var(--text-tertiary); font-family: var(--font-mono); font-size: 12px; margin-top: 40px;">
                    Connecting to network...
                </div>
            </div>

            <div class="input-panel">
                <input type="text" id="message-input" class="msg-input" placeholder="Transmit message..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button id="send-button" class="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE SERVICES MODULE -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { 
            getFirestore, collection, doc, setDoc, getDoc, deleteDoc, addDoc, query, orderBy, onSnapshot, serverTimestamp 
        } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            projectId: "nexus-web-development-official"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const GLOBAL_CODE = 'GLOBAL';
        const GLOBAL_NAME = 'Global Chat';

        let currentUser = null;
        let currentUserProfile = { username: 'Anonymous', role: 'Member' };
        let activeRoomId = GLOBAL_CODE;
        let activeRoomCreator = null;
        let messagesUnsubscribe = null;
        let myRooms = JSON.parse(localStorage.getItem('textnexus_joined_rooms') || '[]');

        // AUTH TRACKING & FETCH USER ROLE
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                try {
                    const userSnap = await getDoc(doc(db, "users", user.uid));
                    if (userSnap.exists()) {
                        currentUserProfile = userSnap.data();
                    } else {
                        currentUserProfile = {
                            username: user.email.split('@')[0],
                            role: 'Member'
                        };
                    }
                } catch (e) {
                    console.error("Error fetching user profile:", e);
                }
            } else {
                currentUserProfile = { username: 'Anonymous', role: 'Member' };
            }

            document.getElementById('user-role-display').textContent = `ROLE // ${currentUserProfile.role.toUpperCase()}`;
            renderRoomList();
            if (activeRoomId) updateHeaderButtons();
        });

        function generateCode() {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let code = '';
            for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            return code;
        }

        window.createNewGroup = async function() {
            if (!currentUser) {
                alert("Please Sign In on index.html first!");
                return;
            }

            const roomName = prompt("Enter Group Name:", "Nexus Channel");
            if (!roomName) return;

            const roomCode = generateCode();
            try {
                await setDoc(doc(db, "rooms", roomCode), {
                    name: roomName,
                    code: roomCode,
                    createdBy: currentUser.email,
                    createdAt: serverTimestamp()
                });
                saveAndSwitchRoom(roomCode, roomName);
            } catch (err) {
                alert("Failed to create room: " + err.message);
            }
        };

        window.joinGroupByCode = async function() {
            const codeInput = document.getElementById('join-code-input');
            const code = codeInput.value.trim().toUpperCase();

            if (code === GLOBAL_CODE) {
                switchRoom(GLOBAL_CODE, GLOBAL_NAME);
                codeInput.value = '';
                return;
            }

            if (code.length !== 6) {
                alert("Please enter a valid 6-digit code.");
                return;
            }

            try {
                const roomDoc = await getDoc(doc(db, "rooms", code));
                if (roomDoc.exists()) {
                    saveAndSwitchRoom(code, roomDoc.data().name);
                    codeInput.value = '';
                } else {
                    alert("Room code not found.");
                }
            } catch (err) {
                console.error(err);
            }
        };

        function saveAndSwitchRoom(code, name) {
            if (code !== GLOBAL_CODE && !myRooms.some(r => r.code === code)) {
                myRooms.push({ code, name });
                localStorage.setItem('textnexus_joined_rooms', JSON.stringify(myRooms));
            }
            renderRoomList();
            switchRoom(code, name);
        }

        function renderRoomList() {
            const container = document.getElementById('room-list-container');
            container.innerHTML = '';

            const globalCard = document.createElement('div');
            globalCard.className = `room-card global-card ${activeRoomId === GLOBAL_CODE ? 'active' : ''}`;
            globalCard.onclick = () => switchRoom(GLOBAL_CODE, GLOBAL_NAME);
            globalCard.innerHTML = `
                <div class="room-info">
                    <h4>${GLOBAL_NAME}</h4>
                    <span>#GLOBAL</span>
                </div>
                <span class="room-badge">PUBLIC</span>
            `;
            container.appendChild(globalCard);

            myRooms.forEach(room => {
                const card = document.createElement('div');
                card.className = `room-card ${activeRoomId === room.code ? 'active' : ''}`;
                card.onclick = () => switchRoom(room.code, room.name);
                card.innerHTML = `
                    <div class="room-info">
                        <h4>${room.name}</h4>
                        <span>#${room.code}</span>
                    </div>
                    <span class="room-badge">JOINED</span>
                `;
                container.appendChild(card);
            });
        }

        async function switchRoom(code, name) {
            activeRoomId = code;
            renderRoomList();

            document.getElementById('current-room-name').textContent = name;
            const codeTag = document.getElementById('current-room-code');
            codeTag.textContent = `#${code}`;

            if (code !== GLOBAL_CODE) {
                try {
                    const roomSnap = await getDoc(doc(db, "rooms", code));
                    activeRoomCreator = roomSnap.exists() ? roomSnap.data().createdBy : null;
                } catch (e) {
                    activeRoomCreator = null;
                }
            } else {
                activeRoomCreator = null;
            }

            updateHeaderButtons();
            listenToMessages(code);
        }

        function updateHeaderButtons() {
            const leaveBtn = document.getElementById('leave-room-btn');
            const deleteBtn = document.getElementById('delete-room-btn');

            if (!activeRoomId || activeRoomId === GLOBAL_CODE) {
                leaveBtn.style.display = 'none';
                deleteBtn.style.display = 'none';
                return;
            }

            leaveBtn.style.display = 'inline-flex';
            if (currentUser && activeRoomCreator === currentUser.email) {
                deleteBtn.style.display = 'inline-flex';
            } else {
                deleteBtn.style.display = 'none';
            }
        }

        window.leaveActiveRoom = function() {
            if (!activeRoomId || activeRoomId === GLOBAL_CODE) return;
            myRooms = myRooms.filter(r => r.code !== activeRoomId);
            localStorage.setItem('textnexus_joined_rooms', JSON.stringify(myRooms));
            switchRoom(GLOBAL_CODE, GLOBAL_NAME);
        };

        window.deleteActiveRoom = async function() {
            if (!activeRoomId || activeRoomId === GLOBAL_CODE) return;
            if (!confirm("Delete room permanently?")) return;

            try {
                await deleteDoc(doc(db, "rooms", activeRoomId));
                myRooms = myRooms.filter(r => r.code !== activeRoomId);
                localStorage.setItem('textnexus_joined_rooms', JSON.stringify(myRooms));
                switchRoom(GLOBAL_CODE, GLOBAL_NAME);
            } catch (err) {
                alert("Failed to delete room: " + err.message);
            }
        };

        function listenToMessages(roomCode) {
            if (messagesUnsubscribe) messagesUnsubscribe();

            const messagesArea = document.getElementById('messages-area');
            messagesArea.innerHTML = `<div style="text-align:center; color:var(--text-tertiary); font-family:var(--font-mono); font-size:11px;">Decrypting stream...</div>`;

            const q = query(collection(db, "rooms", roomCode, "messages"), orderBy("createdAt", "asc"));

            messagesUnsubscribe = onSnapshot(q, (snapshot) => {
                messagesArea.innerHTML = '';

                snapshot.docs.forEach(docSnap => {
                    const data = docSnap.data();
                    const isMe = currentUser && currentUser.email === data.senderEmail;
                    
                    const row = document.createElement('div');
                    row.className = `msg-row ${isMe ? 'me' : 'other'}`;

                    const timeStr = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'NOW';
                    const username = data.username || (data.senderEmail ? data.senderEmail.split('@')[0] : 'Anonymous');
                    const role = data.role || 'Member';
                    const roleClass = role.toLowerCase();

                    row.innerHTML = `
                        <div class="msg-meta">
                            <span class="role-badge ${roleClass}">${role}</span>
                            <span>${escapeHtml(username)}</span>
                            <span>${timeStr}</span>
                        </div>
                        <div class="msg-bubble">${escapeHtml(data.text)}</div>
                    `;

                    messagesArea.appendChild(row);
                });

                messagesArea.scrollTop = messagesArea.scrollHeight;
            });
        }

        window.sendMessage = async function() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();

            if (!text || !activeRoomId) return;

            if (!currentUser) {
                alert("Please Sign In on index.html to transmit messages.");
                return;
            }

            input.value = '';

            try {
                await addDoc(collection(db, "rooms", activeRoomId, "messages"), {
                    text: text,
                    senderEmail: currentUser.email,
                    username: currentUserProfile.username || currentUser.email.split('@')[0],
                    role: currentUserProfile.role || 'Member',
                    createdAt: serverTimestamp()
                });
            } catch (err) {
                console.error("Error sending message:", err);
            }
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        switchRoom(GLOBAL_CODE, GLOBAL_NAME);
    </script>
</body>
</html>
