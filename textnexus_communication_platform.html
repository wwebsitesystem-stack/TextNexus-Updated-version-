<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextNexus // Communication Platform</title>
    
    <!-- Fonts matching index.html -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #000000;
            --bg-surface: #0a0a0a;
            --glass-panel: rgba(15, 15, 15, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.12);
            
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --text-tertiary: #555555;
            
            --accent-glow: rgba(255, 255, 255, 0.15);
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            user-select: none; -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* PLATFORM LAYOUT */
        .platform-container {
            display: flex;
            width: 100%;
            height: 100%;
            background: var(--bg-surface);
        }

        /* ROOM SIDEBAR */
        .rooms-sidebar {
            width: 280px;
            background: rgba(8, 8, 8, 0.9);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--glass-border);
        }

        .sidebar-title {
            font-size: 11px;
            font-family: var(--font-mono);
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s var(--ease-out);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:hover {
            background: var(--text-primary);
            color: #000;
        }

        .action-btn.danger:hover {
            background: #ff4444;
            color: #ffffff;
            border-color: #ff4444;
        }

        .code-join-box {
            display: flex;
            gap: 8px;
        }

        .code-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 8px;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 12px;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
        }

        .code-input:focus {
            border-color: rgba(255, 255, 255, 0.3);
        }

        .room-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .room-card {
            padding: 12px;
            border-radius: 10px;
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-card:hover {
            background: var(--glass-hover);
        }

        .room-card.active {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--glass-border);
        }

        .room-info h4 {
            font-size: 13px;
            font-weight: 500;
        }

        .room-info span {
            font-size: 10px;
            font-family: var(--font-mono);
            color: var(--text-secondary);
        }

        .room-badge {
            font-family: var(--font-mono);
            font-size: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-secondary);
        }

        /* CHAT VIEWPORT */
        .chat-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        .chat-header {
            height: 56px;
            padding: 0 24px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-panel);
        }

        .chat-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-title h3 {
            font-size: 14px;
            font-weight: 500;
        }

        .code-tag {
            font-family: var(--font-mono);
            font-size: 11px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            padding: 2px 8px;
            border-radius: 12px;
            color: #fff;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .messages-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg-row {
            display: flex;
            flex-direction: column;
            max-width: 65%;
            animation: fadeIn 0.2s var(--ease-out);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .msg-row.me {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg-row.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-meta {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-tertiary);
            margin-bottom: 4px;
            display: flex;
            gap: 8px;
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.4;
            user-select: text;
        }

        .msg-row.me .msg-bubble {
            background: #ffffff;
            color: #000000;
            border-bottom-right-radius: 2px;
            font-weight: 400;
        }

        .msg-row.other .msg-bubble {
            background: var(--glass-panel);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            border-bottom-left-radius: 2px;
        }

        /* INPUT PANEL */
        .input-panel {
            padding: 16px 24px;
            border-top: 1px solid var(--glass-border);
            background: var(--glass-panel);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .msg-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px 16px;
            color: #fff;
            font-family: var(--font-sans);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .msg-input:focus {
            border-color: rgba(255, 255, 255, 0.25);
        }

        .send-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .send-btn:hover {
            opacity: 0.85;
        }

        .notification-banner {
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid var(--glass-border);
            padding: 8px 16px;
            font-size: 11px;
            font-family: var(--font-mono);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-secondary);
        }

        .notification-banner button {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 10px;
        }
    </style>
</head>
<body>

    <div class="platform-container">
        <!-- SIDEBAR -->
        <div class="rooms-sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Channels</span>
                <button class="action-btn" onclick="createNewGroup()">+ New</button>
            </div>

            <div class="code-join-box">
                <input type="text" id="join-code-input" class="code-input" placeholder="6-DIGIT CODE" maxlength="6">
                <button class="action-btn" onclick="joinGroupByCode()">Join</button>
            </div>

            <div class="room-list" id="room-list-container">
                <!-- Dynamically populated room cards -->
            </div>
        </div>

        <!-- MAIN CHAT VIEWPORT -->
        <div class="chat-viewport">
            <div id="notif-banner" class="notification-banner" style="display: none;">
                <span>Enable desktop notifications for incoming transmissions.</span>
                <button onclick="requestNotificationPermission()">Enable</button>
            </div>

            <div class="chat-header">
                <div class="chat-title">
                    <h3 id="current-room-name">Select or Join a Room</h3>
                    <span id="current-room-code" class="code-tag" style="display: none;">------</span>
                </div>
                
                <div class="header-actions">
                    <button id="leave-room-btn" class="action-btn danger" onclick="leaveActiveRoom()" style="display: none;">Leave</button>
                    <button id="delete-room-btn" class="action-btn danger" onclick="deleteActiveRoom()" style="display: none;">Delete</button>
                    <div class="sidebar-title" id="connection-status">RTDB // SYNCED</div>
                </div>
            </div>

            <div class="messages-area" id="messages-area">
                <div style="text-align: center; color: var(--text-tertiary); font-family: var(--font-mono); font-size: 12px; margin-top: 40px;">
                    Enter a 6-digit room code or create a new channel to start messaging.
                </div>
            </div>

            <div class="input-panel">
                <input type="text" id="message-input" class="msg-input" placeholder="Transmit encrypted message..." disabled onkeydown="if(event.key==='Enter') sendMessage()">
                <button id="send-button" class="send-btn" onclick="sendMessage()" disabled>Send</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE SERVICES MODULE -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { 
            getFirestore, 
            collection, 
            doc, 
            setDoc, 
            getDoc, 
            deleteDoc,
            addDoc, 
            query, 
            orderBy, 
            onSnapshot, 
            serverTimestamp 
        } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        // Same Firebase Project Config as index.html
        const firebaseConfig = {
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            projectId: "nexus-web-development-official"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let activeRoomId = null;
        let activeRoomCreator = null;
        let messagesUnsubscribe = null;
        let myRooms = JSON.parse(localStorage.getItem('textnexus_joined_rooms') || '[]');

        // CHECK NOTIFICATION PERMISSION
        if ("Notification" in window && Notification.permission === "default") {
            document.getElementById('notif-banner').style.display = 'flex';
        }

        window.requestNotificationPermission = function() {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    document.getElementById('notif-banner').style.display = 'none';
                }
            });
        };

        // AUTH TRACKING
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            renderRoomList();
            if (activeRoomId) {
                updateHeaderButtons();
            }
        });

        // GENERATE RANDOM 6-DIGIT ALPHANUMERIC CODE
        function generateCode() {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        // CREATE NEW GROUP CHAT
        window.createNewGroup = async function() {
            if (!currentUser) {
                alert("Please Sign In via the main header top right to create group chats.");
                return;
            }

            const roomName = prompt("Enter Group Name:", "Nexus Channel");
            if (!roomName) return;

            const roomCode = generateCode();
            const roomRef = doc(db, "rooms", roomCode);

            try {
                await setDoc(roomRef, {
                    name: roomName,
                    code: roomCode,
                    createdBy: currentUser.email,
                    createdAt: serverTimestamp()
                });

                saveAndSwitchRoom(roomCode, roomName);
            } catch (err) {
                console.error("Error creating group:", err);
                alert("Failed to create room: " + err.message);
            }
        };

        // JOIN GROUP BY 6-DIGIT CODE
        window.joinGroupByCode = async function() {
            const codeInput = document.getElementById('join-code-input');
            const code = codeInput.value.trim().toUpperCase();

            if (code.length !== 6) {
                alert("Please enter a valid 6-digit code.");
                return;
            }

            try {
                const roomDoc = await getDoc(doc(db, "rooms", code));
                if (roomDoc.exists()) {
                    const data = roomDoc.data();
                    saveAndSwitchRoom(code, data.name);
                    codeInput.value = '';
                } else {
                    alert("Room with code '" + code + "' not found.");
                }
            } catch (err) {
                console.error("Error joining room:", err);
            }
        };

        function saveAndSwitchRoom(code, name) {
            if (!myRooms.some(r => r.code === code)) {
                myRooms.push({ code, name });
                localStorage.setItem('textnexus_joined_rooms', JSON.stringify(myRooms));
            }
            renderRoomList();
            switchRoom(code, name);
        }

        // RENDER SIDEBAR ROOMS
        function renderRoomList() {
            const container = document.getElementById('room-list-container');
            container.innerHTML = '';

            if (myRooms.length === 0) {
                container.innerHTML = `<div style="font-size:11px; color:var(--text-tertiary); padding:10px 0; text-align:center;">No channels active.</div>`;
                return;
            }

            myRooms.forEach(room => {
                const card = document.createElement('div');
                card.className = `room-card ${activeRoomId === room.code ? 'active' : ''}`;
                card.onclick = () => switchRoom(room.code, room.name);

                card.innerHTML = `
                    <div class="room-info">
                        <h4>${room.name}</h4>
                        <span>#${room.code}</span>
                    </div>
                    <span class="room-badge">JOINED</span>
                `;
                container.appendChild(card);
            });
        }

        // SWITCH ACTIVE CHAT ROOM
        async function switchRoom(code, name) {
            activeRoomId = code;
            renderRoomList();

            document.getElementById('current-room-name').textContent = name;
            const codeTag = document.getElementById('current-room-code');
            codeTag.textContent = `#${code}`;
            codeTag.style.display = 'inline-block';

            document.getElementById('message-input').disabled = false;
            document.getElementById('send-button').disabled = false;

            // Fetch room document to identify creator
            try {
                const roomSnap = await getDoc(doc(db, "rooms", code));
                if (roomSnap.exists()) {
                    activeRoomCreator = roomSnap.data().createdBy;
                } else {
                    activeRoomCreator = null;
                }
            } catch (err) {
                console.error("Error reading room metadata:", err);
                activeRoomCreator = null;
            }

            updateHeaderButtons();
            listenToMessages(code);
        }

        function updateHeaderButtons() {
            const leaveBtn = document.getElementById('leave-room-btn');
            const deleteBtn = document.getElementById('delete-room-btn');

            if (!activeRoomId) {
                leaveBtn.style.display = 'none';
                deleteBtn.style.display = 'none';
                return;
            }

            leaveBtn.style.display = 'inline-flex';

            // Show Delete button if current logged-in user is room creator
            if (currentUser && activeRoomCreator === currentUser.email) {
                deleteBtn.style.display = 'inline-flex';
            } else {
                deleteBtn.style.display = 'none';
            }
        }

        // LEAVE ACTIVE ROOM
        window.leaveActiveRoom = function() {
            if (!activeRoomId) return;

            myRooms = myRooms.filter(r => r.code !== activeRoomId);
            localStorage.setItem('textnexus_joined_rooms', JSON.stringify(myRooms));

            resetChatView();
            renderRoomList();
        };

        // DELETE ACTIVE ROOM PERMANENTLY
        window.deleteActiveRoom = async function() {
            if (!activeRoomId) return;

            const confirmDelete = confirm("Are you sure you want to permanently delete this group chat for everyone?");
            if (!confirmDelete) return;

            try {
                await deleteDoc(doc(db, "rooms", activeRoomId));

                myRooms = myRooms.filter(r => r.code !== activeRoomId);
                localStorage.setItem('textnexus_joined_rooms', JSON.stringify(myRooms));

                resetChatView();
                renderRoomList();
            } catch (err) {
                console.error("Error deleting group chat:", err);
                alert("Failed to delete room: " + err.message);
            }
        };

        function resetChatView() {
            if (messagesUnsubscribe) messagesUnsubscribe();

            activeRoomId = null;
            activeRoomCreator = null;

            document.getElementById('current-room-name').textContent = "Select or Join a Room";
            document.getElementById('current-room-code').style.display = 'none';
            document.getElementById('message-input').disabled = true;
            document.getElementById('send-button').disabled = true;

            document.getElementById('leave-room-btn').style.display = 'none';
            document.getElementById('delete-room-btn').style.display = 'none';

            document.getElementById('messages-area').innerHTML = `
                <div style="text-align: center; color: var(--text-tertiary); font-family: var(--font-mono); font-size: 12px; margin-top: 40px;">
                    Enter a 6-digit room code or create a new channel to start messaging.
                </div>
            `;
        }

        // REAL-TIME MESSAGES LISTENER
        function listenToMessages(roomCode) {
            if (messagesUnsubscribe) messagesUnsubscribe();

            const messagesArea = document.getElementById('messages-area');
            messagesArea.innerHTML = `<div style="text-align:center; color:var(--text-tertiary); font-family:var(--font-mono); font-size:11px;">Decrypting stream...</div>`;

            const q = query(
                collection(db, "rooms", roomCode, "messages"),
                orderBy("createdAt", "asc")
            );

            let initialLoad = true;

            messagesUnsubscribe = onSnapshot(q, (snapshot) => {
                messagesArea.innerHTML = '';

                snapshot.docs.forEach(docSnap => {
                    const data = docSnap.data();
                    const isMe = currentUser && currentUser.email === data.sender;
                    
                    const row = document.createElement('div');
                    row.className = `msg-row ${isMe ? 'me' : 'other'}`;

                    const timeStr = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'NOW';
                    const senderName = data.sender ? data.sender.split('@')[0] : 'Anonymous';

                    row.innerHTML = `
                        <div class="msg-meta">
                            <span>${senderName}</span>
                            <span>${timeStr}</span>
                        </div>
                        <div class="msg-bubble">${escapeHtml(data.text)}</div>
                    `;

                    messagesArea.appendChild(row);

                    // TRIGGER POPUP NOTIFICATION FOR NEW MESSAGES FROM OTHERS
                    if (!initialLoad && !isMe && Notification.permission === "granted") {
                        new Notification(`TextNexus [${roomCode}]`, {
                            body: `${senderName}: ${data.text}`,
                            icon: 'https://cdn-icons-png.flaticon.com/512/888/888853.png'
                        });
                    }
                });

                initialLoad = false;
                messagesArea.scrollTop = messagesArea.scrollHeight;
            });
        }

        // SEND MESSAGE
        window.sendMessage = async function() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();

            if (!text || !activeRoomId) return;

            if (!currentUser) {
                alert("Please Sign In using the 'Sign In' button at the top right of the dashboard.");
                return;
            }

            input.value = '';

            try {
                await addDoc(collection(db, "rooms", activeRoomId, "messages"), {
                    text: text,
                    sender: currentUser.email,
                    createdAt: serverTimestamp()
                });
            } catch (err) {
                console.error("Error sending message:", err);
            }
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
