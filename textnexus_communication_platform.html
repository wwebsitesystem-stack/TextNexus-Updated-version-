<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextNexus // Communication Platform</title>
    <!-- High-End Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Monochromatic Luxury Palette (Strictly No Purple) */
            --bg-base: #000000;
            --bg-surface: #0a0a0a;
            --glass-panel: rgba(18, 18, 18, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.05);
            
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --text-tertiary: #555555;
            
            --accent-primary: #ffffff;
            --accent-glow: rgba(255, 255, 255, 0.15);
            
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        ::selection {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* --- LAYOUT --- */
        .chat-container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* CHANNELS / CHAT SIDEBAR */
        .channels-sidebar {
            width: 260px;
            background: var(--bg-surface);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 20px 14px;
            gap: 20px;
            flex-shrink: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
        }

        .sidebar-header h2 {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: -0.2px;
            color: #fff;
            text-transform: uppercase;
            font-family: var(--font-mono);
        }

        .channel-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .channel-item:hover {
            background: var(--glass-hover);
            color: var(--text-primary);
        }

        .channel-item.active {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .channel-item svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* MAIN CHAT STREAM */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            position: relative;
        }

        .chat-header {
            height: 60px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: var(--glass-panel);
            backdrop-filter: blur(20px);
        }

        .chat-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .status-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            color: #888888;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 3px 8px;
            border-radius: 12px;
        }

        /* MESSAGES VIEWPORT */
        .messages-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .messages-viewport::-webkit-scrollbar {
            width: 6px;
        }

        .messages-viewport::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .message-row {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            max-width: 80%;
            animation: fadeIn 0.25s var(--ease-out-expo);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.me {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #ffffff;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
        }

        .message-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-row.me .message-content {
            align-items: flex-end;
        }

        .message-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-tertiary);
            font-family: var(--font-mono);
        }

        .message-bubble {
            background: var(--glass-panel);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 13px;
            line-height: 1.5;
            color: #ffffff;
            backdrop-filter: blur(20px);
        }

        .message-row.me .message-bubble {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        /* COMPOSER BAR */
        .chat-input-area {
            padding: 20px 24px;
            background: var(--bg-surface);
            border-top: 1px solid var(--glass-border);
        }

        .input-box-wrapper {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 8px 16px;
            gap: 12px;
            transition: border-color 0.2s ease;
        }

        .input-box-wrapper:focus-within {
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.06);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            font-family: var(--font-sans);
        }

        .chat-input::placeholder {
            color: var(--text-tertiary);
        }

        .send-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .send-btn:hover {
            background: #e5e5e5;
            transform: scale(1.02);
        }

        .send-btn svg {
            width: 14px;
            height: 14px;
            stroke: #000;
            fill: none;
            stroke-width: 2.2;
        }

        .state-empty {
            text-align: center;
            margin: auto;
            color: var(--text-tertiary);
            font-family: var(--font-mono);
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        
        <!-- SIDEBAR CHANNELS -->
        <aside class="channels-sidebar">
            <div class="sidebar-header">
                <h2>Channels</h2>
            </div>
            
            <div class="channel-list">
                <div class="channel-item active">
                    <svg viewBox="0 0 24 24"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
                    general-mesh
                </div>
                <div class="channel-item">
                    <svg viewBox="0 0 24 24"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
                    announcements
                </div>
                <div class="channel-item">
                    <svg viewBox="0 0 24 24"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
                    dev-telemetry
                </div>
            </div>
        </aside>

        <!-- MAIN CHAT STREAM -->
        <main class="chat-main">
            
            <header class="chat-header">
                <div class="chat-title">
                    <span># general-mesh</span>
                    <span class="status-tag">FIREBASE SYNC</span>
                </div>
                <div style="font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary);" id="user-status-indicator">
                    CONNECTING...
                </div>
            </header>

            <!-- MESSAGES CONTAINER -->
            <div class="messages-viewport" id="messages-container">
                <div class="state-empty" id="loading-state">
                    CONNECTING TO TEXTNEXUS MESH...
                </div>
            </div>

            <!-- COMPOSER BAR -->
            <div class="chat-input-area">
                <form id="chat-form" onsubmit="sendMessage(event)">
                    <div class="input-box-wrapper">
                        <input type="text" id="message-input" class="chat-input" placeholder="Message #general-mesh..." autocomplete="off">
                        <button type="submit" class="send-btn">
                            Send
                            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        </button>
                    </div>
                </form>
            </div>

        </main>
    </div>

    <!-- FIREBASE MODULES & REALTIME CHAT ENGINE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com",
            projectId: "nexus-web-development-official",
            storageBucket: "nexus-web-development-official.firebasestorage.app",
            messagingSenderId: "553556577139",
            appId: "1:553556577139:web:ea4469b06c2c01cc999306",
            measurementId: "G-S6K1M5PZLE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const messagesContainer = document.getElementById('messages-container');
        const userStatusIndicator = document.getElementById('user-status-indicator');
        const messageInput = document.getElementById('message-input');

        let currentUser = null;

        // AUTH LISTENER
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = {
                    uid: user.uid,
                    name: user.displayName || user.email.split('@')[0],
                    avatar: (user.displayName || user.email)[0].toUpperCase()
                };
                userStatusIndicator.textContent = `AUTHENTICATED: ${currentUser.name}`;
            } else {
                // Anonymous Guest fallback
                const randomId = Math.floor(Math.random() * 8999 + 1000);
                currentUser = {
                    uid: `guest_${randomId}`,
                    name: `Node_${randomId}`,
                    avatar: 'G'
                };
                userStatusIndicator.textContent = `GUEST NODE: ${currentUser.name}`;
            }
        });

        // REALTIME DATABASE LISTENER (/messages)
        const messagesRef = ref(db, 'messages');
        onValue(messagesRef, (snapshot) => {
            const data = snapshot.val();
            messagesContainer.innerHTML = '';

            if (!data) {
                messagesContainer.innerHTML = `
                    <div class="state-empty">
                        NO MESSAGES YET IN #GENERAL-MESH. START THE CONVERSATION.
                    </div>
                `;
                return;
            }

            const messageList = Object.values(data);
            messageList.forEach(msg => {
                const isMe = currentUser && (msg.uid === currentUser.uid);
                const row = document.createElement('div');
                row.className = `message-row ${isMe ? 'me' : ''}`;

                const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'NOW';

                row.innerHTML = `
                    <div class="avatar">${msg.avatar || 'N'}</div>
                    <div class="message-content">
                        <div class="message-meta">
                            <span>${msg.sender || 'Node'}</span>
                            <span>•</span>
                            <span>${timeStr}</span>
                        </div>
                        <div class="message-bubble">${escapeHtml(msg.text)}</div>
                    </div>
                `;

                messagesContainer.appendChild(row);
            });

            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });

        // SEND MESSAGE FUNCTION
        window.sendMessage = function(e) {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            push(ref(db, 'messages'), {
                uid: currentUser.uid,
                sender: currentUser.name,
                avatar: currentUser.avatar,
                text: text,
                timestamp: serverTimestamp()
            });

            messageInput.value = '';
        };

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
